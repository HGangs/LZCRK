  lines.push(['行政区', p.district || ''].map(csvCell).join(','));
  lines.push(['负责人', p.owner || ''].map(csvCell).join(','));
  lines.push(['状态', p.status || ''].map(csvCell).join(','));
  lines.push(['开工日期', p.startDate || ''].map(csvCell).join(','));
  lines.push(['导出时间', nowTs()].map(csvCell).join(','));
  lines.push('');
  lines.push(['物料编码','物料名称','单位','现有物料数量','入库数量','入库时间','出库数量','出库时间'].map(csvCell).join(','));
  let sumIn = 0, sumOut = 0, sumNow = 0, n = 0;
  db.materials.forEach(m => {
    const v = agg.pm[p.id + '|' + m.id];
    if(!v) return;
    const now = v.out - v.in;
    const vIn = v.in - (v.tIn || 0), vOut = v.out - (v.tOut || 0);
    sumIn += vIn; sumOut += vOut; sumNow += now; n++;
    lines.push([m.code, m.name, m.unit, now, vIn, v.lastIn || '', vOut, v.lastOut || ''].map(csvCell).join(','));
  });
  if(n) lines.push(['合计','', '', sumNow, sumIn, '', sumOut, ''].map(csvCell).join(','));
  else lines.push(['', '该项目暂无领用或退回记录', '', '', '', '', '', ''].map(csvCell).join(','));

  lines.push('');
  lines.push(head.map(csvCell).join(','));
  const cols = ps.map(() => 0);
  let sumStock = 0, sumHold = 0, sumTotal = 0;
  activeMat.forEach(m => {
    const q = stockOf(agg, m.id);
    sumStock += q;
    let hold = 0;
    const vals = ps.map((p, i) => {
      const v = agg.pm[p.id + '|' + m.id];
      const n = v ? v.out - v.in : 0;
      cols[i] += n; hold += n;
      return n;
    });
    const total = q + hold;
    sumHold += hold; sumTotal += total;
    lines.push([m.code, m.name, m.unit, q].concat(vals, [hold, total, m.safetyStock]).map(csvCell).join(','));
  });
  lines.push(['合计','','',sumStock].concat(cols, [sumHold, sumTotal, '']).map(csvCell).join(','));
  if(download('跨项目物料汇总_' + today() + '.csv', lines.join('\n')))

function importMaterials(rows){
  if(!rows || !rows.length){ toast('文件内容为空', 'bad'); return; }
  const header = (rows[0] || []).map(h => String(h == null ? '' : h).trim());
  const map = {};
  header.forEach((h, i) => {
    if(/编码|code/i.test(h)) map.code = i;
    else if(/名称|name/i.test(h)) map.name = i;
    else if(/规格|型号|spec/i.test(h)) map.spec = i;
    else if(/单位|unit/i.test(h)) map.unit = i;
    else if(/分类|品类|category/i.test(h)) map.category = i;
    else if(/品牌|厂商|brand/i.test(h)) map.brand = i;
    else if(/初始|期初|init/i.test(h)) map.init = i;
    else if(/阈值|预警|safety/i.test(h)) map.safety = i;
    else if(/备注|remark/i.test(h)) map.remark = i;
  });
  if(map.name === undefined){ toast('缺少「物料名称」列，请使用导入模板', 'bad'); return; }

  const codes = new Set(db.materials.map(m => String(m.code).toLowerCase()));
  const pick = (r, i) => (i === undefined || r[i] == null) ? '' : String(r[i]).trim();
  const num = (r, i, d) => {
    if(i === undefined) return d;
    const v = Number(String(r[i] == null ? '' : r[i]).replace(/,/g, ''));
    return isFinite(v) && v >= 0 ? v : d;
  };
  let added = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    if(!r || !r.length) return;
    const name = pick(r, map.name);
    if(!name) return;
    let code = pick(r, map.code);
    if(!code) code = suggestMatCode();
    if(codes.has(code.toLowerCase())){ skipped++; return; }
    codes.add(code.toLowerCase());
    db.materials.push({
      id: uid('m'), code, name,
      spec: pick(r, map.spec),
      unit: pick(r, map.unit) || 'PCS',
      category: pick(r, map.category),
      brand: pick(r, map.brand),
      initialStock: num(r, map.init, 0),
      safetyStock: num(r, map.safety, 0),
      remark: pick(r, map.remark)
    });
    added++;
  });
  if(!added){
    toast('没有可导入的物料' + (skipped ? '（' + skipped + ' 条编码重复）' : '（检查物料名称是否为空）'), 'bad');
    return;

  saveDB();
  logAct('物料管理', '导入', '批量导入物料 ' + added + ' 条' + (skipped ? '，跳过重复编码 ' + skipped + ' 条' : ''));

}

  }

    const k = t.dataset.key;
    state.tfCart[k] = (state.tfCart[k] && state.tfCart[k].length) ? state.tfCart[k] : [{to:'', qty:''}];

    const k = t.dataset.key, i = Number(t.dataset.idx);
    if(state.tfCart[k] && state.tfCart[k][i] !== undefined){
      state.tfCart[k].splice(i, 1);

  if(act === 'clearLogs'){
    if(!can('logs','delete')){ toast('无清空日志权限', 'bad'); return; }

      body:'清空后无法恢复，建议先导出留档。当前筛选条件不影响清空范围。',
      onOk(){ const n = db.logs.length; db.logs = []; saveDB(); logAct('操作日志','删除','清空全部日志（清空前 ' + n + ' 条）'); state.logPage = 1; render(); toast('日志已清空','ok'); }});
    return;
  }

  /* ---- 备份 ---- */
  if(act === 'syncClock'){
    if(!can('settings','edit')){ toast('无设置修改权限', 'bad'); return; }

    return;

  if(act === 'manualClock'){ modalClockManual(); return; }
  if(act === 'saveClockManual'){ saveClockManual(); return; }
  if(act === 'resetClock'){
    if(!can('settings','edit')){ toast('无设置修改权限', 'bad'); return; }
    resetClock(); return;
  }
  if(act === 'bkNowTop'){
    if(!can('backups','create')){ toast('无备份权限', 'bad'); return; }

  if(act === 'pickBkDir'){
    if(!can('backups','edit')){ toast('无备份设置修改权限', 'bad'); return; }

    c.autoThreshold = numOr(($('#bk-thr') || {}).value, 20, 1, 999);
    c.autoKeep = numOr(($('#bk-akeep') || {}).value, 6, 1, 50);
    c.autoPath = ((($('#bk-apath') || {}).value) || '').trim();
    c.manualKeep = numOr(($('#bk-mkeep') || {}).value, 20, 1, 100);
    c.manualRemindDays = numOr(($('#bk-mremind') || {}).value, 7, 1, 365);
    c.manualPath = ((($('#bk-mpath') || {}).value) || '').trim();
    c.autoDownload = !!($('#bk-dl') || {}).checked;
    trimBackups();
    saveBackups();
    saveDB();
    logAct('数据备份','编辑','更新备份设置：' + (c.autoEnabled ? '自动备份每日 ' + c.autoTime : '已关闭自动备份') +
      '，阈值 ' + c.autoThreshold + ' 次 / ' + c.autoIntervalMin + ' 分钟，自动路径 ' + (c.autoPath || '默认') + '，手动路径 ' + (c.manualPath || '默认'));
    render(); toast('备份设置已保存', 'ok');
    return;
  }
  if(act === 'downloadCurrent'){
    if(download('wms_data_' + today() + '.json', JSON.stringify(db, null, 2))) toast('当前数据已导出为 JSON', 'ok');
    return;

  /* ---- 设置 ---- */
  if(act === 'pickLoginBg'){
    if(!can('settings','edit')){ toast('无设置修改权限', 'bad'); return; }
    const f = $('#bgFile'); if(f){ f.value = ''; f.click(); }
    return;
  }
  if(act === 'clearLoginBg'){
    if(!can('settings','edit')){ toast('无设置修改权限', 'bad'); return; }
    askConfirm({title:'移除登录背景', heading:'确认移除登录页背景图？', okText:'移除',
      body:'登录页将恢复默认渐变背景，已上传的图片会从本地数据中删除（不影响其他设置）。',
      onOk(){ db.settings.loginBg = ''; saveDB(); logAct('工作台设置','编辑','移除登录页背景图'); render(); toast('已恢复默认背景', 'ok'); }});
    return;
  }
  if(act === 'changePwd'){
    const u = currentUser();
    if(!u){ toast('请先登录', 'bad'); showLogin(); return; }
    const p0 = (($('#pw-old') || {}).value) || '';
    const p1 = (($('#pw-new') || {}).value) || '';
    const p2 = (($('#pw-new2') || {}).value) || '';
    if(!p0){ toast('请输入原密码', 'bad'); return; }
    if(u.pwd !== hashPw(p0)){ toast('原密码不正确', 'bad'); return; }

    if(p1 === p0){ toast('新密码不能与原密码相同', 'bad'); return; }
    if(p1 !== p2){ toast('两次输入的新密码不一致', 'bad'); return; }
    u.pwd = hashPw(p1);
    u.pwdUpdatedAt = nowTs();
    saveDB();
    logAct('我的账号','编辑','修改本人登录密码');

    logAct('工作台设置','编辑','工作台名称由「' + old + '」改为「' + name + '」');

  if(act === 'resetDB'){
    if(!can('settings','edit')){ toast('无重置数据权限', 'bad'); return; }

      body:'当前 <b>' + db.projects.length + '</b> 个项目、<b>' + db.materials.length + '</b> 种物料、<b>' + db.records.length + '</b> 条流水将被清空并替换为演示数据。账号、角色与已创建的备份不受影响。',
      onOk(){
        const keepUsers = db.users, keepRoles = db.roles, keepLogs = db.logs, keepSettings = db.settings;
        seed();
        db.users = keepUsers; db.roles = keepRoles; db.logs = keepLogs; db.settings = keepSettings;
        invalidatePerms();
        saveDB(); state.projectId = null; state.materialId = null;
        draft.in = {warehouseId:defaultWarehouse(), date:today(), operator:'', remark:'', inType:'purchase', projectId:'', lines:[{materialId:'', qty:'', remark:''}]};
        draft.out = {warehouseId:defaultWarehouse(), date:today(), operator:'', remark:'', projectId:'', lines:[{materialId:'', qty:'', remark:''}]};
        logAct('工作台设置','重置','恢复为演示数据');
        render(); toast('已重置为演示数据', 'ok');
      }});
    return;
  }

  if(act === 'navToggle'){
    document.body.classList.toggle('nav-open');

  }
  if(act === 'zoomStep'){

  if(act === 'zoomReset'){ setDisplay({scale:100}, true); render(); return; }
  if(act === 'ubTab'){ state.ubTab = t.dataset.m === 'units' ? 'units' : 'overview'; render(); return; }
  if(act === 'allocFromUnit'){ modalAllocFromUnit(id); return; }
  if(act === 'saveAlloc'){ saveAlloc(t.dataset.id); return; }
  if(act === 'cloudPullNow'){ cloudManualRefresh(); return; }
  if(act === 'cloudHistory'){ modalCloudHistory(); return; }
  if(act === 'cloudConflictModal'){ modalCloudConflict(); return; }
  if(act === 'cloudRestore'){ cloudRestoreSnapshot(t.dataset.id); return; }
  if(act === 'cloudForcePush'){ cloudForcePush(); return; }
  if(act === 'cloudTakeRemote'){ cloudTakeRemote(); return; }

  /* ---- 显示与字体 ---- */
  if(act === 'dpFontDetect'){
    const done = fonts => {
      state.fonts = fonts.slice();
      render();
      toast('已检测到 ' + fonts.length + ' 个本机字体', 'ok');
    };
    if(typeof window.queryLocalFonts === 'function'){
      window.queryLocalFonts().then(list => {
        const names = Array.from(new Set((list || []).map(f => f.family).filter(Boolean)));
        if(names.length) done(names);
        else { toast('未获取到字体列表，可继续使用内置字体', 'bad'); }
      }).catch(() => toast('检测被拒绝或当前环境不支持', 'bad'));

      status: $('#pd-status').value,
      startDate: $('#pd-start').value,
      remark: ($('#pd-remark').value || '').trim()
    });

    logAct('项目管理','编辑','更新项目 ' + code + ' ' + name);
    state.plDrawer = '';
    render();
    toast('项目已保存', 'ok');
    return;
  }
  if(act === 'plGroupToggle'){
    const g = t.dataset.g;
    if(!state.plGroups) state.plGroups = {};
    const box = t.closest('.pl-group');
    const wasCollapsed = box ? box.classList.contains('collapsed') : false;

    if(box) box.classList.toggle('collapsed', !wasCollapsed);
    return;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  const act = t.dataset.change;
  if(!act) return;
  const type = t.dataset.type, key = t.dataset.key, i = Number(t.dataset.i);
  const id = t.dataset.id;

  if(act === 'draft'){
    if(!can(type === 'in' ? 'inbound' : 'outbound','create')) return;
    draft[type][key] = t.value;
    if(key === 'unitId'){ draft[type].contactIdx = ''; render(); return; }   // 换单位后联系人候选与已选都要重置
    if(key === 'warehouseId' || key === 'projectId'){ refreshLines(type); }
    refreshSummary(type); return;
  }
  if(act === 'lineMat'){ draft[type].lines[i].materialId = t.value; updateLineHint(type, i); refreshSummary(type); return; }
  if(act === 'lineRemark'){ draft[type].lines[i].remark = t.value; return; }
  if(act === 'lineQty'){ draft[type].lines[i].qty = t.value; updateLineHint(type, i); refreshSummary(type); return; }

  if(act === 'metricToggle'){
    if(!can('settings','edit')){ t.checked = !t.checked; toast('无仪表盘配置权限', 'bad'); return; }
    const arr = db.settings.metrics;
    if(t.checked){ if(!arr.includes(id)) arr.push(id); }
    else db.settings.metrics = arr.filter(x => x !== id);
    saveDB(); render(); return;
  }
  if(act === 'f'){ state.recFilters[key] = t.value; state.recPage = 1; refreshRecordTable(); return; }
  if(act === 'mdSelect'){ state.materialId = t.value; render(); return; }
  if(act === 'district'){ state.district = t.value; state.projectId = null; render(); return; }
  if(act === 'owner'){ state.owner = t.value; state.projectId = null; render(); return; }
  if(act === 'dlFilter'){
    state.docLedger[t.dataset.key] = t.value;
    render(); return;
  }
  if(act === 'tfHistFilter'){
    state.tfHist[t.dataset.key] = t.value; render(); return;
  }
  if(act === 'deHead'){
    if(docEdit && docEdit.head){
      docEdit.head[t.dataset.key] = t.value;
      if(t.dataset.key === 'unitId'){ docEdit.head.contactIdx = ''; refreshDocEditBody(); }
    }
    return;
  }
  if(act === 'deMat'){
    if(docEdit && docEdit.rows[Number(t.dataset.i)]){
      docEdit.rows[Number(t.dataset.i)].materialId = t.value;
      refreshDocEditBody();
    }
    return;
  }
  if(act === 'deQty'){
    if(docEdit && docEdit.rows[Number(t.dataset.i)]) docEdit.rows[Number(t.dataset.i)].qty = t.value;
    return;
  }
  if(act === 'deRemark'){
    if(docEdit && docEdit.rows[Number(t.dataset.i)]) docEdit.rows[Number(t.dataset.i)].remark = t.value;
    return;
  }
  if(act === 'clockAuto'){
    if(!can('settings','edit')){ t.checked = !t.checked; toast('无设置修改权限', 'bad'); return; }
    timeCfg().auto = !!t.checked;
    saveDB();
    toast(t.checked ? '已开启启动自动校准' : '已关闭启动自动校准', 'ok');
    return;
  }
  if(act === 'plDistrict'){ state.pl.district = t.value; state.plHighlight = null; refreshPlBody(); return; }
  if(act === 'plOwner'){ state.pl.owner = t.value; state.plHighlight = null; refreshPlBody(); return; }
  if(act === 'plUnit'){ state.pl.unit = t.value; state.plHighlight = null; refreshPlBody(); return; }
  if(act === 'dpScale'){
    if(!can('settings','edit')) return;
    setDisplay({scale: Math.min(200, Math.max(50, Number(t.value) || 100))});
    return;
  }
  if(act === 'allocUnit'){
    const pid = (document.querySelector('[data-act="saveAlloc"]') || {}).dataset;
    if(pid && pid.id) allocBodyRender(pid.id, t.value);
    return;
  }
  if(act === 'dpFont'){ setDisplay({font: t.value}); return; }
  if(act === 'plStatus'){ state.pl.status = t.value; state.plHighlight = null; refreshPlBody(); return; }
  if(act === 'lf'){ state.logFilters[key] = t.value; state.logPage = 1; refreshLogs(); return; }
  if(act === 'rolePerm'){
    if(!permDraft) return;
    const mod = t.dataset.mod, p = t.dataset.p;
    if(!permDraft[mod]) permDraft[mod] = [];
    if(t.checked){ if(!permDraft[mod].includes(p)) permDraft[mod].push(p); }
    else permDraft[mod] = permDraft[mod].filter(x => x !== p);
    if(!permDraft[mod].length) delete permDraft[mod];
    updatePermCount();
    return;
  }

  if(act === 'stockSafety'){
    if(!can('materials','edit')){ t.value = (db.materials.find(x => x.id === id) || {}).safetyStock || 0; toast('无编辑物料权限', 'bad'); return; }
    const m = db.materials.find(x => x.id === id);
    if(!m) return;
    m.safetyStock = Math.max(0, Number(t.value) || 0);
    saveDB();
    logAct('物料管理','编辑','调整「' + m.name + '」预警阈值为 ' + fmt(m.safetyStock));
    const el = $('#matTable');
    if(el) el.innerHTML = materialTableHtml(filteredMaterials());
    toast('「' + m.name + '」预警阈值已更新为 ' + fmt(m.safetyStock), 'ok'); return;
  }
  if(act === 'stockNote'){
    if(!can('stock','edit')){ t.value = (db.materials.find(x => x.id === id) || {}).remark || ''; toast('无台账编辑权限', 'bad'); return; }
    const m = db.materials.find(x => x.id === id);
    if(!m) return;
    m.remark = t.value;
    saveDB(); logAct('库存明细台账','编辑','更新「' + m.name + '」备注'); toast('备注已保存', 'ok'); return;
  }

  if(act === 'saveEditMaterial'){ return; }
});

/* ================= 拖动排序（库存台账 / 物料档案共用 db.materials 顺序） ================= */
let dragMid = null;
function moveMaterial(srcId, dstId, after){
  const arr = db.materials;
  const from = arr.findIndex(m => m.id === srcId);
  if(from < 0) return false;
  const item = arr.splice(from, 1)[0];
  let to = arr.findIndex(m => m.id === dstId);
  if(to < 0){ arr.splice(from, 0, item); return false; }
  if(after) to += 1;
  if(to > arr.length) to = arr.length;
  arr.splice(to, 0, item);
  return true;
}
function refreshStockTable(){
  const rows = stockRowsData();
  const el = $('#stockTable');
  if(el) el.innerHTML = stockTableHtml(rows);
  const c = $('#stockCnt');
  if(c) c.textContent = rows.length + ' / ' + db.materials.length + ' 条';
}
function clearDragMarks(){
  $$('tr.drag-over').forEach(x => x.classList.remove('drag-over'));
  $$('tr.dragging').forEach(x => x.classList.remove('dragging'));
}
document.addEventListener('dragstart', e => {
  const h = e.target.closest && e.target.closest('[data-drag-handle]');
  if(!h) return;
  if(h.classList.contains('off')){ e.preventDefault(); return; }
  const tr = h.closest('tr[data-mid]');
  if(!tr) return;
  dragMid = tr.dataset.mid;
  tr.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragMid); }catch(err){}
});
document.addEventListener('dragover', e => {
  if(!dragMid) return;
  const tr = e.target.closest && e.target.closest('tr[data-mid]');
  if(!tr || tr.dataset.mid === dragMid) return;
  e.preventDefault();
  $$('tr.drag-over').forEach(x => x.classList.remove('drag-over'));
  tr.classList.add('drag-over');
});
document.addEventListener('dragleave', e => {
  const tr = e.target.closest && e.target.closest('tr[data-mid]');
  if(tr) tr.classList.remove('drag-over');
});
document.addEventListener('drop', e => {
  if(!dragMid) return;
  const tr = e.target.closest && e.target.closest('tr[data-mid]');
  const src = dragMid;
  dragMid = null;
  if(!tr){ clearDragMarks(); return; }
  e.preventDefault();
  const dst = tr.dataset.mid;
  let after = false;
  const rect = tr.getBoundingClientRect();
  if(rect && rect.height) after = e.clientY > rect.top + rect.height / 2;
  clearDragMarks();
  if(dst === src) return;
  if(state.page === 'materials' && !can('materials','edit')){ toast('无编辑物料权限', 'bad'); return; }
  if(state.page === 'stock' && !can('stock','edit')){ toast('无台账编辑权限', 'bad'); return; }
  if(moveMaterial(src, dst, after)){
    saveDB();
    if(state.page === 'materials'){ $('#matTable').innerHTML = materialTableHtml(filteredMaterials()); }
    else { refreshStockTable(); }
    toast('物料顺序已更新', 'ok');
  }
});
document.addEventListener('dragend', () => { dragMid = null; clearDragMarks(); });

document.addEventListener('keydown', e => {
  const tid = e.target.id || '';
  if(tid === 'projInput-out' || tid === 'projInput-in'){
    const type = e.target.dataset.type || 'out';
    if(e.isComposing || e.keyCode === 229) return;   // 中文输入法组合中，回车用于上屏而非选中
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); comboMove(type, e.key === 'ArrowDown' ? 1 : -1); return;
    }
    if(e.key === 'Enter'){
      e.preventDefault();
      const box = document.getElementById('projList-' + type);
      if(box && box.classList.contains('open')){
        const items = box.querySelectorAll('.combo-item');
        const i = Number(box.dataset.hl || -1);
        if(i >= 0 && items[i]) applyProjectPick(type, items[i].dataset.id);
        else if(items.length === 1) applyProjectPick(type, items[0].dataset.id);
        else closeProjectCombos();
      }
      return;
    }
    if(e.key === 'Escape'){ closeProjectCombos(); return; }
  }
  if(e.key === 'Escape'){
    if(state.plDrawer){ state.plDrawer = ''; syncPlDrawer(); return; }
    const lr = $('#loginRoot');
    if(lr && lr.innerHTML.trim() && session.guest){ lr.innerHTML = ''; return; }   // 只读模式关闭登录浮层
    closeModal(); closeCtxMenu();
  }
  /* 隐藏的管理员入口：Ctrl+Alt+L（窗口里没有登录按钮，避免只读角色误触） */
  if(e.altKey && (e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')){
    e.preventDefault(); showLogin(); return;
  }
  if(e.key === 'Enter' && e.target.id === 'rn-name'){ e.preventDefault(); saveModuleName(); return; }
  if(e.key === 'Enter' && e.target.id === 'globalSearch'){
    state.page = 'records'; state.recFilters.kw = e.target.value; state.recPage = 1; render();
  }
  if(e.key === 'Enter' && (e.target.id === 'lg-account' || e.target.id === 'lg-pwd')) doLogin();
});

      if(wasAdmin && !willAdmin){

      type:newType, isReturn, inType: newType === 'in' ? inType : '',
      warehouseId:$('#er-wh').value, materialId:matId, qty,
      date:$('#er-date').value, projectId: pid, operator:$('#er-op').value.trim(),
      remark:$('#er-remark').value.trim()
    });
    saveDB(); logAct('出入库台账','编辑','编辑流水 ' + oldDesc + ' → ' + (newType === 'in' ? '入库' : '出库') + ' ' + fmt(qty));
    closeModal(); render(); toast('流水已更新，库存已重算', 'ok'); return;
  }
});

/* file upload */
$('#fileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!canMod('projectList','import')){ toast('无项目导入权限', 'bad'); return; }
  try{
    let rows;
    if(/\.csv$/i.test(file.name)){
      rows = parseCSV(await readTextAuto(file));
    }else if(/\.xlsx$/i.test(file.name)){
      rows = await parseXLSX(await file.arrayBuffer());
    }else{
      toast('仅支持 .xlsx 或 .csv 文件', 'bad'); return;
    }
    importProjects(rows);
  }catch(err){
    toast('导入失败：' + (err && err.message ? err.message : '文件无法解析'), 'bad');
  }
});

/* 物料批量导入文件 */
$('#matFileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!can('materials','create')){ toast('无新增物料权限', 'bad'); return; }
  try{
    let rows;
    if(/\.csv$/i.test(file.name)){
      rows = parseCSV(await readTextAuto(file));
    }else if(/\.xlsx$/i.test(file.name)){
      rows = await parseXLSX(await file.arrayBuffer());
    }else{
      toast('仅支持 .xlsx 或 .csv 文件', 'bad'); return;
    }
    importMaterials(rows);
  }catch(err){
    toast('导入失败：' + (err && err.message ? err.message : '文件无法解析'), 'bad');
  }
});

/* 备份 JSON 导入（迁移用） */
$('#bkFileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) importBackupFile(f);
});

/* 登录页背景图上传 */
$('#bgFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!can('settings','edit')){ toast('无设置修改权限', 'bad'); return; }
  if(!/^image\//.test(file.type)){ toast('请选择图片文件（JPG / PNG）', 'bad'); return; }
  try{
    const dataUrl = await compressImage(file, 1600, 0.82);
    if(dataUrl.length > 2400000){ toast('图片过大，请换一张尺寸更小的图片', 'bad'); return; }
    db.settings.loginBg = dataUrl;
    saveDB();
    logAct('工作台设置','编辑','更新登录页背景图（' + Math.round(file.size / 1024) + ' KB → ' + Math.round(dataUrl.length / 1024) + ' KB）');
    render(); toast('登录页背景已更新', 'ok');
  }catch(err){
    toast('图片处理失败：' + (err && err.message ? err.message : '未知错误'), 'bad');
  }
});

/* ================= boot ================= */
loadSession();
loadDB();
loadBackups();
loadBackupDirHandle();   // 预读已连接的本机备份目录
/* 桌面客户端：菜单「导入数据备份」把 JSON 交给页面走原有导入流程 */
if(window.desktopHost && window.desktopHost.onBackupFile){
  try{ window.desktopHost.onBackupFile(p => { if(p && p.text) importBackupText(p.text, p.name); }); }catch(e){}
}
applyClockOffset();      // 应用上次校准的时间偏移
/* 自动校准：开启且距上次校准超过 6 小时（或从未校准）时后台同步 */
try{
  const tc = timeCfg();
  const stale = !tc.syncedAt || (Date.now() - Date.parse(tc.syncedAt.replace(' ', 'T'))) > 6 * 3600 * 1000;
  if(tc.auto && stale) setTimeout(() => { syncClock(true).catch(() => {}); }, 1200);
}catch(e){}
if(session.userId && !currentUser()) session = {userId:'', guest:false};
try{
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  if(PAGES[parts[0]]){
    state.page = parts[0];
    if(parts[0] === 'projects' && parts[1] === 'summary') state.pview = 'summary';
  }
}catch(e){}
bootAutoBackup();
/* 无会话默认进入「项目只读」：界面里不出现登录入口；管理员用 #/login 或 Ctrl+Alt+L 打开登录浮层 */
if(!session.userId && !session.guest){ session = {userId:'', guest:true}; saveSession(); }
render();
if(/^#\/?login\b/i.test(location.hash || '')) showLogin();   // 隐藏的管理员入口
/* 云端模式：后台异步初始化，不阻塞首屏；本地/客户端不会进入 */
if(cloudEnabled()) setTimeout(cloudInit, 60);
setInterval(checkScheduledBackup, 60 * 1000);   // 每分钟检查「每日定时备份」是否到点

</script>
</body>
</html>
