/* ================= aggregates ================= */
function loadAgg(){
  const mt = {};   // materialId -> {in,out,lastIn,lastOut}
  const pm = {};   // projectId|materialId -> {in,out,tIn,tOut,lastIn,lastOut}
  const pr = {};   // projectId -> {in,out,transferIn,transferOut,last,docs}
  const wh = {};   // warehouseId -> {in,out,last,docs}
  const pdm = {};  // projectId|docNo|materialId -> {out,moved}：该单据领用量 / 已调拨出量
  for(const r of db.records){
    const q = Number(r.qty) || 0;
    /* 调拨流水只改项目持有，不计入仓库口径（库存总量不变） */
    if(!r.transfer){
      if(!mt[r.materialId]) mt[r.materialId] = {in:0, out:0, lastIn:'', lastOut:''};
      mt[r.materialId][r.type] += q;
      const lt = r.type === 'in' ? 'lastIn' : 'lastOut';
      if(r.date > mt[r.materialId][lt]) mt[r.materialId][lt] = r.date;
    }
    if(r.projectId){
      const k = r.projectId + '|' + r.materialId;
      if(!pm[k]) pm[k] = {in:0, out:0, tIn:0, tOut:0, lastIn:'', lastOut:''};
      pm[k][r.type] += q;
      if(r.transfer) pm[k][r.type === 'in' ? 'tIn' : 'tOut'] += q;
      const lt2 = r.type === 'in' ? 'lastIn' : 'lastOut';
      if(r.date > pm[k][lt2]) pm[k][lt2] = r.date;
      if(!pr[r.projectId]) pr[r.projectId] = {in:0, out:0, transferIn:0, transferOut:0, last:'', docs:{}};
      pr[r.projectId][r.type] += q;
      if(r.transfer) pr[r.projectId][r.type === 'in' ? 'transferIn' : 'transferOut'] += q;
      pr[r.projectId].docs[r.docNo] = 1;
      if(r.date > pr[r.projectId].last) pr[r.projectId].last = r.date;
    }
    if(r.warehouseId && !r.transfer){
      if(!wh[r.warehouseId]) wh[r.warehouseId] = {in:0, out:0, last:'', docs:{}};
      wh[r.warehouseId][r.type] += q;
      wh[r.warehouseId].docs[r.docNo] = 1;
      if(r.date > wh[r.warehouseId].last) wh[r.warehouseId].last = r.date;
    }
    /* 单据可调拨量：领用出库累加 out，从该单据调拨出去累加 moved */
    if(r.projectId && r.docNo && r.materialId){
      if(!r.transfer && r.type === 'out'){
        const dk = r.projectId + '|' + r.docNo + '|' + r.materialId;
        if(!pdm[dk]) pdm[dk] = {out:0, moved:0};
        pdm[dk].out += q;
      }else if(r.transfer && r.type === 'in' && r.fromProjectId && r.srcDocNo){
        const dk = r.fromProjectId + '|' + r.srcDocNo + '|' + r.materialId;
        if(!pdm[dk]) pdm[dk] = {out:0, moved:0};
        pdm[dk].moved += q;
      }
    }
  }
  return {mt, pm, pr, wh, pdm};
}
/* 某单据某物料还能调拨多少：单据领用 − 已调拨出，并与项目当前持有量取小 */
function transferableQty(agg, pid, docNo, mid){
  const d = agg.pdm[pid + '|' + docNo + '|' + mid];
  const left = d ? Math.max(0, d.out - d.moved) : 0;
  const have = Math.max(0, stockInProject(agg, pid, mid));
  return Math.min(left, have);
}
/* 仓库现有库存（含期初） */
function stockOf(agg, mid){
  const m = db.materials.find(x => x.id === mid);
  if(!m) return 0;
  const v = agg.mt[mid] || {in:0, out:0};
  return (Number(m.initialStock) || 0) + v.in - v.out;
}
/* 项目净持有量 = 领用出库 − 项目返回入库 */
function stockInProject(agg, pid, mid){
  const v = agg.pm[pid + '|' + mid];
  return v ? v.out - v.in : 0;
}
function projectTotal(agg, pid){
  let s = 0;
  for(const k in agg.pm) if(k.indexOf(pid + '|') === 0) s += agg.pm[k].out - agg.pm[k].in;
  return s;
}
function stockTotal(agg){
  let s = 0;
  db.materials.forEach(m => { const v = agg.mt[m.id] || {in:0,out:0}; s += (Number(m.initialStock)||0) + v.in - v.out; });
  return s;
}
function stockStatus(m, qty){
  const safe = Number(m.safetyStock) || 0;
  if(qty <= 0) return {key:'out', label:'无库存', cls:'st-out'};
  if(qty < safe) return {key:'low', label:'库存不足', cls:'st-low'};
  return {key:'ok', label:'充足', cls:'st-ok'};
}

/* 筛选候选：只取当前项目里真实存在的值 —— 项目全部删除后候选随之清空，不会残留行政区 */
function projectFilterValues(field){
  const set = new Set();
  let blank = false;
  db.projects.forEach(p => {
    const v = String(p[field] == null ? '' : p[field]).trim();
    if(v) set.add(v); else blank = true;
  });
  const known = field === 'district' ? DISTRICTS.filter(d => set.has(d)) : [];
  const extra = Array.from(set).filter(v => known.indexOf(v) < 0);
  return { list: known.concat(extra), blank: blank };
}

/* ================= dashboard ================= */
function rangeBounds(range){
  const now = nowDate();
  const y = now.getFullYear(), m = now.getMonth();
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0,10);
  if(range === 'month') return {from: iso(new Date(y, m, 1)), to: today(), label:'本月'};
  if(range === 'quarter'){ const qs = Math.floor(m / 3) * 3; return {from: iso(new Date(y, qs, 1)), to: today(), label:'本季度'}; }
  if(range === 'year') return {from: iso(new Date(y, 0, 1)), to: today(), label:'本年'};
  return {from:'0000-01-01', to:'9999-12-31', label:'全部'};
}

function metricValue(id, agg, range){
  const b = rangeBounds(range);
  const recs = db.records.filter(r => range === 'all' ? true : (r.date >= b.from && r.date <= b.to));
  const sum = t => recs.filter(r => r.type === t && inTypeOf(r) !== 'return').reduce((s,r) => s + Number(r.qty), 0);
  switch(id){
    case 'materials': return {v: db.materials.length, unit:'种', sub: new Set(db.records.map(r => r.materialId)).size + ' 种有流水', ic:'box'};
    case 'stock': return {v: stockTotal(agg), unit:'', sub:'含期初与全部出入库', ic:'layers'};
    case 'issued': {
      let hold = 0, projs = 0, kinds = 0;
      db.projects.forEach(p => { const t = projectTotal(agg, p.id); if(t > 0){ projs++; hold += t; } });
      db.materials.forEach(m => {
        let h = 0;
        db.projects.forEach(p => { const v = agg.pm[p.id + '|' + m.id]; if(v) h += v.out - v.in; });
        if(h > 0) kinds++;
      });
      return {v: hold, unit:'', sub: projs + ' 个项目 · ' + kinds + ' 种在项目现场', ic:'folder'};
    }
    case 'alerts': {
      let n = 0;
      db.materials.forEach(m => { if(stockOf(agg, m.id) < (Number(m.safetyStock)||0)) n++; });
      return {v:n, unit:'项', sub:'低于预警阈值的物料数', ic:'alert'};
    }
    case 'inbound': return {v: sum('in'), unit:'', sub:b.label + '入库（不含项目返回）', ic:'in'};
    case 'outbound': return {v: sum('out'), unit:'', sub:b.label + '项目领用出库', ic:'out'};
    case 'return': {
      const q = recs.filter(r => inTypeOf(r) === 'return').reduce((s,r) => s + Number(r.qty), 0);
      const c = new Set(recs.filter(r => inTypeOf(r) === 'return').map(r => r.docNo)).size;
      return {v:q, unit:'', sub:b.label + '项目余料退回（' + c + ' 张单）', ic:'back'};
    }
    case 'projects': return {v: db.projects.length, unit:'个', sub: db.projects.filter(p => p.status === '进行中').length + ' 个进行中', ic:'folder'};
    case 'active': return {v: new Set(recs.filter(r => r.projectId).map(r => r.projectId)).size, unit:'个', sub:b.label + '有领用或退回', ic:'chart'};
    case 'records': return {v: new Set(recs.map(r => r.docNo)).size, unit:'笔', sub:b.label + '单据数（' + recs.length + ' 行明细）', ic:'file'};
    case 'ratio': { const i = sum('in'), o = sum('out'); return {v: i ? Math.round(o / i * 100) : 0, unit:'%', sub:'出库 ÷ 入库（' + b.label + '）', ic:'chart'}; }
    default: return {v:'-', unit:'', sub:'', ic:'chart'};
  }
}

function last6Months(){
  const out = [], now = nowDate();
  for(let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push({key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0'), label: (d.getMonth() + 1) + '月'});
  }
  return out;
}

/* ===== 仪表盘：卡片布局（12 列栅格，拖动排序 + 拖拽缩放，存本机 localStorage） ===== */
const DASH_KEY = 'wms_dash_v1';
const DASH_DEF = [
  {id:'kpi',    w:12, h:5},
  {id:'trend',  w:8,  h:8},
  {id:'rank',   w:4,  h:8},
  {id:'cal',    w:7,  h:11},
  {id:'issued', w:5,  h:11},
  {id:'alerts', w:12, h:8}
];
function dashClamp(v, min, max, dft){
  const n = Math.round(Number(v));
  return isFinite(n) ? Math.max(min, Math.min(max, n)) : dft;
}
function dashLayout(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(DASH_KEY) || 'null'); }catch(e){ saved = null; }
  const out = [];
  if(Array.isArray(saved)){
    saved.forEach(it => {
      if(!it || typeof it.id !== 'string') return;
      const def = DASH_DEF.find(d => d.id === it.id);
      if(!def || out.some(x => x.id === it.id)) return;
      out.push({id:def.id, w:dashClamp(it.w, 3, 12, def.w), h:dashClamp(it.h, 3, 18, def.h)});
    });
  }
  DASH_DEF.forEach(d => { if(!out.some(x => x.id === d.id)) out.push({id:d.id, w:d.w, h:d.h}); });
  return out;
}
function saveDashLayout(lay){
  try{ localStorage.setItem(DASH_KEY, JSON.stringify(lay.map(x => ({id:x.id, w:x.w, h:x.h})))); }catch(e){}
}
function resetDashLayout(){
  try{ localStorage.removeItem(DASH_KEY); }catch(e){}
  render(); toast('已恢复仪表盘默认布局', 'ok');
}
let _dashOp = null;
function dashGeo(grid){
  const st = getComputedStyle(grid);
  const gap = parseFloat(st.columnGap) || 14;
  const rowH = parseFloat(st.gridAutoRows) || 52;
  return {gap, rowH: rowH + gap, colW: (grid.clientWidth - gap * 11) / 12};
}
/* 渲染后给每张卡插入握把与缩放手柄 */
function initDashGrid(){
  const grid = document.getElementById('dashGrid');
  if(!grid) return;
  if(!initDashGrid._bound){
    document.addEventListener('pointerdown', dashDown);
    initDashGrid._bound = true;
  }
  const lay = dashLayout();
  grid.querySelectorAll('.dash-card').forEach(card => {
    const it = lay.find(x => x.id === card.dataset.card);
    if(it){
      card.style.gridColumn = 'span ' + it.w;
      card.style.gridRow = 'span ' + it.h;
    }
    const head = card.querySelector('.card-head');
    if(head && !head.querySelector('.dash-grip')){
      const g = document.createElement('span');
      g.className = 'dash-grip';
      g.dataset.drag = card.dataset.card;
      g.title = '按住拖动，调整卡片位置';
      g.innerHTML = icon('grip');
      head.insertBefore(g, head.firstChild);
    }
    if(!card.querySelector('.dash-rs')){
      const r = document.createElement('i');
      r.className = 'dash-rs';
      r.title = '拖动调整大小';
      card.appendChild(r);
    }
  });
}
function dashDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const t = e.target;
  if(!t || !t.closest) return;
  const grip = t.closest('[data-drag]');
  const rs = t.closest('.dash-rs');
  if(!grip && !rs) return;
  const grid = document.getElementById('dashGrid');
  if(!grid || !grid.contains(t)) return;
  const card = (grip || rs).closest('.dash-card');
  if(!card) return;
  const lay = dashLayout();
  const it = lay.find(x => x.id === card.dataset.card);
  if(!it) return;
  e.preventDefault();
  const rect = card.getBoundingClientRect();
  _dashOp = {
    mode: grip ? 'move' : 'resize',
    id: it.id, card, grid, lay, it,
    sx: e.clientX, sy: e.clientY, rect, geo: dashGeo(grid),
    moved: false, target: null, targetId: '', w: it.w, h: it.h, clone: null
  };
  document.body.classList.add('dash-busy');
  document.addEventListener('pointermove', dashMove, {passive:false});
  document.addEventListener('pointerup', dashUp, true);
  document.addEventListener('pointercancel', dashUp, true);
}
function dashMove(e){
  const op = _dashOp;
  if(!op) return;
  const dx = e.clientX - op.sx, dy = e.clientY - op.sy;
  if(!op.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
  op.moved = true;
  e.preventDefault();

  if(op.mode === 'move'){
    if(!op.clone){
      const c = op.card.cloneNode(true);
      c.classList.add('dash-clone');
      c.style.cssText = 'position:fixed;left:' + op.rect.left + 'px;top:' + op.rect.top + 'px;width:' +
        op.rect.width + 'px;height:' + op.rect.height + 'px;margin:0;z-index:9000;pointer-events:none;opacity:.97';
      document.body.appendChild(c);
      op.clone = c;
      op.card.classList.add('dash-ghost');
    }
    op.clone.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    let tgt = under && under.closest ? under.closest('.dash-card') : null;
    if(tgt && (tgt === op.card || tgt.classList.contains('dash-clone'))) tgt = null;
    if(tgt !== op.target){
      if(op.target) op.target.classList.remove('dash-target');
      op.target = tgt;
      op.targetId = tgt && tgt.dataset.card || '';
      if(tgt) tgt.classList.add('dash-target');
    }
  }else{
    const dw = Math.round(dx / (op.geo.colW + op.geo.gap));
    const dh = Math.round(dy / op.geo.rowH);
    op.w = Math.max(3, Math.min(12, op.it.w + dw));
    op.h = Math.max(3, Math.min(18, op.it.h + dh));
    op.card.style.gridColumn = 'span ' + op.w;
    op.card.style.gridRow = 'span ' + op.h;
  }
}
function dashUp(){
  const op = _dashOp;
  if(!op) return;
  document.removeEventListener('pointermove', dashMove);
  document.removeEventListener('pointerup', dashUp, true);
  document.removeEventListener('pointercancel', dashUp, true);
  document.body.classList.remove('dash-busy');
  if(op.clone) op.clone.remove();
  if(op.target) op.target.classList.remove('dash-target');
  op.card.classList.remove('dash-ghost');
  _dashOp = null;
  if(!op.moved) return;

  const lay = dashLayout();
  if(op.mode === 'move' && op.targetId){
    const from = lay.findIndex(x => x.id === op.id);
    const to = lay.findIndex(x => x.id === op.targetId);
    if(from >= 0 && to >= 0 && from !== to){
      const item = lay.splice(from, 1)[0];
      lay.splice(to, 0, item);
      saveDashLayout(lay);
    }
  }else if(op.mode === 'resize'){
    const it = lay.find(x => x.id === op.id);
    if(it && (it.w !== op.w || it.h !== op.h)){ it.w = op.w; it.h = op.h; saveDashLayout(lay); }
  }
  render();
}

/* ===== 仪表盘：出入库日历（按日着色，点选看当天笔数） ===== */
function calState(){
  if(!state.cal || typeof state.cal !== 'object') state.cal = {ym:'', day:''};
  if(!state.cal.ym){
    const d = nowDate();
    state.cal.ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  return state.cal;
}
function calShift(delta){
  const c = calState();
  const ymd = c.ym.split('-').map(Number);
  const d = new Date(ymd[0], ymd[1] - 1 + delta, 1);
  c.ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  c.day = '';
}
/* 每天入库/出库「笔数」按单据去重统计（一张单多行明细只算 1 笔）+ 数量合计；
   调拨流水不计（只在项目间转移，不是真实出入库） */
function calDayStats(ym){
  const map = {};
  db.records.forEach(r => {
    if(r.transfer || !r.date || r.date.slice(0, 7) !== ym) return;
    const d = map[r.date] || (map[r.date] = {in:0, out:0, inQ:0, outQ:0, seen:{}});
    const t = r.type === 'in' ? 'in' : 'out';
    const k = t + '|' + r.docNo;
    if(!d.seen[k]){ d.seen[k] = 1; d[t]++; }
    d[t + 'Q'] += Number(r.qty) || 0;
  });
  return map;
}
function calDetailHtml(st, day){
  if(!day) return '<div class="cal-detail"><span class="sub">点击有记录的日期，查看当天入库 / 出库笔数</span></div>';
  if(!st) return '<div class="cal-detail"><b class="mono">' + esc(day) + '</b><span class="sub">当天没有出入库记录</span></div>';
  const docs = db.records.filter(r => r.date === day && !r.transfer);
  const g = {};
  docs.forEach(r => {
    const k = r.type + '|' + r.docNo;
    if(!g[k]) g[k] = {type:r.type, no:r.docNo, n:0, qty:0};
    g[k].n++; g[k].qty += Number(r.qty) || 0;
  });
  const chips = Object.keys(g).map(k => g[k]).map(x =>
    '<span class="chip">' + (x.type === 'in'
      ? '<span class="badge badge-in" style="margin-right:4px">入库</span>'
      : '<span class="badge badge-out" style="margin-right:4px">出库</span>') +
      esc(x.no) + ' · ' + x.n + ' 项 · ' + fmt(x.qty) + '</span>').join('');
  return '<div class="cal-detail">' +
      '<b class="mono">' + esc(day) + '</b>' +
      '<span class="cm cm-in" style="font-size:11.5px">入库 ' + st.in + ' 笔</span>' +
      '<span class="cm cm-out" style="font-size:11.5px">出库 ' + st.out + ' 笔</span>' +
      '<span class="sub">入库合计 +' + fmt(st.inQ) + ' · 出库合计 −' + fmt(st.outQ) + '</span>' +
      (chips ? '<div class="cal-docs">' + chips + '</div>' : '') +
    '</div>';
}
function calCardHtml(){
  const c = calState();
  const ymd = c.ym.split('-').map(Number);
  const y = ymd[0], mo = ymd[1];
  const stats = calDayStats(c.ym);
  const pad = (new Date(y, mo - 1, 1).getDay() + 6) % 7;   // 周一作为一周起点
  const days = new Date(y, mo, 0).getDate();
  const todayS = today();

  let cells = '';
  for(let i = 0; i < pad; i++) cells += '<div class="cal-cell blank"></div>';
  for(let d = 1; d <= days; d++){
    const ds = c.ym + '-' + String(d).padStart(2, '0');
    const st = stats[ds] || null;
    const has = !!(st && (st.in || st.out));
    cells += '<div class="cal-cell' + (has ? ' has' : '') + (ds === todayS ? ' today' : '') + (c.day === ds ? ' sel' : '') + '"' +
        (has ? ' data-act="calPick" data-d="' + ds + '"' : '') + '>' +
      '<span class="cal-d">' + d + '</span>' +
      (has ? '<span class="cal-marks">' +
        (st.in ? '<i class="cm cm-in" title="入库 ' + st.in + ' 笔">入 ' + st.in + '</i>' : '') +
        (st.out ? '<i class="cm cm-out" title="出库 ' + st.out + ' 笔">出 ' + st.out + '</i>' : '') +
      '</span>' : '') + '</div>';
  }
  const mt = Object.keys(stats).reduce((a, k) => {
    const s2 = stats[k];
    return {in:a.in + s2.in, out:a.out + s2.out, inQ:a.inQ + s2.inQ, outQ:a.outQ + s2.outQ};
  }, {in:0, out:0, inQ:0, outQ:0});

  return '<div class="card"><div class="card-head">' +
      '<div class="card-title">' + icon('clock') + '出入库日历' +
        '<span class="cnt">本月 入库 ' + mt.in + ' 笔 / 出库 ' + mt.out + ' 笔</span></div>' +
      '<div class="row cal-head">' +
        '<div class="cal-legend"><span><i style="background:var(--green)"></i>入库</span>' +
          '<span><i style="background:var(--red)"></i>出库</span></div>' +
        '<div class="cal-nav">' +
          '<button class="btn btn-sm btn-ghost" data-act="calMonth" data-dir="-1" title="上个月">‹</button>' +
          '<span class="cal-title">' + y + ' 年 ' + mo + ' 月</span>' +
          '<button class="btn btn-sm btn-ghost" data-act="calMonth" data-dir="1" title="下个月">›</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="calToday">今天</button>' +
        '</div>' +
      '</div></div>' +
    '<div class="card-body">' +
      '<div class="cal-dow">' + ['一','二','三','四','五','六','日'].map(d => '<span>' + d + '</span>').join('') + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      calDetailHtml(c.day ? stats[c.day] : null, c.day) +

function issuedCardHtml(agg){
  const rows = db.materials.map(m => {
    let hold = 0, projs = 0;
    db.projects.forEach(p => {
      const v = agg.pm[p.id + '|' + m.id];
      const n = v ? v.out - v.in : 0;
      if(n > 0){ hold += n; projs++; }
    });
    return {m, hold, projs, stock: stockOf(agg, m.id)};
  }).filter(x => x.hold > 0).sort((a, b) => b.hold - a.hold);

  const total = rows.reduce((s2, x) => s2 + x.hold, 0);
  const stockSum = rows.reduce((s2, x) => s2 + x.stock, 0);
  const body = rows.slice(0, 8).map(x =>

      '<div class="card-title">' + icon('folder') + '项目已领用物料' +
        '<span class="cnt">' + rows.length + ' 种 · 合计 ' + fmt(total) + '</span></div>' +

    '<div class="card-body tight">' +

        ? '<table><thead><tr><th>物料</th><th>单位</th><th class="num">仓库现有</th>' +
            '<th class="num">项目已领用</th><th class="num">涉及项目</th></tr></thead><tbody>' + body + '</tbody>' +

/* 项目模糊匹配：编号 / 名称 / 行政区 / 负责人，空格分隔多个关键词取交集 */
function matchProject(p, kw){
  const s = String(kw == null ? '' : kw).trim().toLowerCase();
  if(!s) return true;
  const hay = [p.code, p.name, p.district, p.owner, p.status].filter(Boolean).join(' ').toLowerCase();
  return s.split(/\s+/).every(w => hay.indexOf(w) >= 0);
}
/* 安全高亮：先按命中区间切分原文，再逐段转义，避免把标签当文本匹配 */
function markKw(text, kw){
  const raw = String(text == null ? '' : text);
  const terms = Array.from(new Set(String(kw || '').trim().toLowerCase().split(/\s+/).filter(Boolean)));
  if(!terms.length) return esc(raw);
  const low = raw.toLowerCase(), marks = [];
  terms.forEach(t => {
    let i = low.indexOf(t);
    while(i >= 0){ marks.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
  });
  if(!marks.length) return esc(raw);
  marks.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  const merged = [];
  marks.forEach(m => {
    const last = merged[merged.length - 1];
    if(last && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]);
    else merged.push([m[0], m[1]]);
  });
  let out = '', pos = 0;
  merged.forEach(([s, e]) => {
    out += esc(raw.slice(pos, s)) + '<span class="kw">' + esc(raw.slice(s, e)) + '</span>';
    pos = e;
  });
  return out + esc(raw.slice(pos));
}

function comboMove(type, dir){
  const box = $('#projList-' + type);
  if(!box || !box.classList.contains('open')) return;
  const items = box.querySelectorAll('.combo-item');
  if(!items.length) return;
  let i = Number(box.dataset.hl || -1) + dir;
  i = Math.max(0, Math.min(items.length - 1, i));
  box.dataset.hl = String(i);
  Array.prototype.forEach.call(items, (el, k) => el.classList.toggle('hl', k === i));
  if(items[i] && typeof items[i].scrollIntoView === 'function') items[i].scrollIntoView({block:'nearest'});
}

function lineHintInfo(type, l){

function pmConfirm(type){

  if(!can(type === 'in' ? 'inbound' : 'outbound', 'create')){ toast('无登记权限', 'bad'); return; }
  const exist = new Set(draft[type].lines.map(l => l.materialId).filter(Boolean));
  let added = 0;
  ids.forEach(mid => {
    if(exist.has(mid)) return;
    const blank = draft[type].lines.findIndex(l => !l.materialId && !Number(l.qty) && !String(l.remark || '').trim());

function submitMovement(type){
  const d = draft[type];
  const mod = type === 'in' ? 'inbound' : 'outbound';
  if(!can(mod, 'create')){ toast('当前账号无' + (type === 'in' ? '入库' : '出库') + '登记权限', 'bad'); return; }
  const isReturn = type === 'in' && d.inType === 'return';
  if(!d.warehouseId){ toast('请选择所属仓库', 'bad'); return; }
  if(!d.date){ toast('请选择业务日期', 'bad'); return; }
  if(isReturn && !d.projectId){ toast('项目返回入库必须选择所属项目', 'bad'); return; }
  const valid = d.lines.filter(l => l.materialId && Number(l.qty) > 0);
  if(!valid.length){ toast('请至少填写一行有效物料', 'bad'); return; }

  if(type === 'out'){
    const agg = loadAgg();
    for(const l of valid){
      const stock = stockOf(agg, l.materialId);
      if(Number(l.qty) > stock){
        const m = db.materials.find(x => x.id === l.materialId);
        toast('「' + (m ? m.name : '') + '」出库量超出仓库库存 ' + fmt(stock), 'bad');
        return;
      }
    }
  }
  if(isReturn){
    const agg = loadAgg();
    const perMat = {};
    valid.forEach(l => { perMat[l.materialId] = (perMat[l.materialId] || 0) + Number(l.qty); });
    for(const mid in perMat){
      const cur = stockInProject(agg, d.projectId, mid);
      if(perMat[mid] > cur){
        const m = db.materials.find(x => x.id === mid);
        toast('「' + (m ? m.name : '') + '」返回量 ' + fmt(perMat[mid]) + ' 超过该项目现有数量 ' + fmt(cur), 'bad');
        return;
      }
    }
  }

  const docNo = nextDocNo(type, d.date);
  valid.forEach(l => {
    db.records.push({
      id: uid('r'), docNo, type,
      inType: type === 'in' ? (d.inType || 'purchase') : '',
      isReturn: !!isReturn,
      warehouseId: d.warehouseId, projectId: (type === 'in' && !isReturn) ? '' : (d.projectId || ''),
      unitId: type === 'out' ? (d.unitId || '') : '',
      contactName: type === 'out' && unitContactAt(d.unitId, d.contactIdx) ? unitContactAt(d.unitId, d.contactIdx).name : '',
      contactPhone: type === 'out' && unitContactAt(d.unitId, d.contactIdx) ? unitContactAt(d.unitId, d.contactIdx).phone : '',
      materialId: l.materialId, qty: Number(l.qty), date: d.date,
      operator: d.operator || '未填写', remark: l.remark || d.remark || '',
      createdAt: nowTs().slice(0,16)
    });
  });
  saveDB();
  const label = type === 'in' ? (IN_TYPE_MAP[d.inType] || IN_TYPES[0]).name + '单 ' : '出库单 ';
  logAct(type === 'in' ? '入库登记' : '出库登记', '新增',
    label + docNo + '，共 ' + valid.length + ' 行' +
    (d.projectId ? '，项目：' + ((db.projects.find(p => p.id === d.projectId) || {}).name || '') : '') +
    (type === 'out' && d.unitId ? '，施工单位：' + unitName(d.unitId) : ''));
  toast(label + docNo + ' 已提交，共 ' + valid.length + ' 行', 'ok');

  draft[type] = {warehouseId: d.warehouseId, date: d.date, operator: d.operator, remark:'',
    inType: type === 'in' ? (d.inType || 'purchase') : '', projectId: d.projectId,
    unitId: type === 'out' ? (d.unitId || '') : '',
    contactIdx: type === 'out' ? (d.contactIdx || '') : '',
    lines:[{materialId:'', qty:'', remark:''}]};
  render();
}

function lastOperator(mid){
  let last = null;
  db.records.forEach(r => { if(r.materialId === mid && (!last || r.date >= last.date)) last = r; });
  return last ? (last.operator || '') : '';
}

function stockRowsData(){
  const agg = loadAgg();
  const kw = (state.stockKw || '').trim().toLowerCase();
  const rows = db.materials
    .filter(m => !kw || (m.code + m.name + m.spec + m.category + (m.brand || '')).toLowerCase().includes(kw))
    .map(m => {
      const v = agg.mt[m.id] || {in:0, out:0};
      const init = Number(m.initialStock) || 0;
      const qty = init + v.in - v.out;
      return {m, init, inQ:v.in, outQ:v.out, qty, st:stockStatus(m, qty), op:lastOperator(m.id)};
    });
  const s = state.stockSort;
  if(s && s.key && s.dir){
    const dir = s.dir;
    rows.sort((a, b) => {
      const va = stockSortVal(a, s.key), vb = stockSortVal(b, s.key);
      let r;
      if(typeof va === 'number' && typeof vb === 'number') r = va - vb;
      else r = String(va).localeCompare(String(vb), 'zh-Hans-CN');
      return dir > 0 ? r : -r;
    });
  }
  return rows;
}

/* 库存台账列定义（预警阈值已移除，改为在物料管理中维护） */
const STOCK_COLS = [
  {k:'name',     t:'物料名称', cls:''},
  {k:'spec',     t:'规格型号', cls:''},
  {k:'unit',     t:'单位',     cls:''},
  {k:'init',     t:'初始库存', cls:'num'},
  {k:'inQ',      t:'入库总量', cls:'num'},
  {k:'outQ',     t:'出库总量', cls:'num'},
  {k:'qty',      t:'现有库存', cls:'num'},
  {k:'status',   t:'库存状态', cls:''},
  {k:'operator', t:'经办人',   cls:''},
  {k:'remark',   t:'备注',     cls:''}
];
const ST_RANK = {out:0, low:1, ok:2};
function stockSortVal(row, key){
  switch(key){
    case 'name': return row.m.name || '';
    case 'spec': return row.m.spec || '';
    case 'unit': return row.m.unit || '';
    case 'init': return row.init;
    case 'inQ': return row.inQ;
    case 'outQ': return row.outQ;
    case 'qty': return row.qty;
    case 'status': return ST_RANK[row.st.key];
    case 'operator': return row.op || '';
    case 'remark': return row.m.remark || '';
    default: return 0;
  }
}
function stockTh(col){
  const s = state.stockSort, on = s.key === col.k && s.dir;
  const ind = on ? (s.dir > 0 ? '▲' : '▼') : '⇅';
  return '<th class="sortable ' + col.cls + (on ? ' on' : '') + '" data-act="stockSort" data-k="' + col.k + '" ' +
    'title="点击切换：升序 → 降序 → 自定义顺序">' + col.t + '<span class="sind">' + ind + '</span></th>';
}

function stockTableHtml(rows){
  if(!rows.length) return '<div class="empty">' + icon('layers') + '<div>没有匹配的物料</div></div>';
  const canEdit = can('stock','edit');
  const sorted = !!(state.stockSort.key && state.stockSort.dir);
  const lockDrag = sorted || !canEdit;
  const body = rows.map(r => {
    const m = r.m;
    return '<tr data-mid="' + m.id + '">' +
      '<td class="drg"><span class="drag-handle' + (lockDrag ? ' off' : '') + '" data-drag-handle="1"' +
        (lockDrag ? '' : ' draggable="true"') + ' title="' + (!canEdit ? '无编辑权限' : (sorted ? '请先取消列排序再拖动' : '按住拖动调整顺序')) + '">' +
        icon('grip') + '</span></td>' +

/* ================= 设备使用看板（v4.18） =================
   口径：
   - 入库 / 出库总数：非调拨流水合计
   - 剩余总数：仓库现有（期初 + 入库 − 出库）
   - 项目使用：项目持有量（领用出库 − 项目返回入库，含调拨净额）
   - 单位领用次数：该单位出库单据数（按 docNo 去重）
   - 单位剩余 = 该单位领用量 − 该单位负责项目的持有量
*/
function usageTotals(agg){
  return db.materials.map(m => {
    const v = agg.mt[m.id] || {in:0, out:0};
    let used = 0;
    for(const k in agg.pm){
      const bar = k.indexOf('|');
      if(k.slice(bar + 1) !== m.id) continue;
      used += agg.pm[k].out - agg.pm[k].in;
    }
    return {m, inQ:Number(v.in) || 0, outQ:Number(v.out) || 0,
      stock:(Number(m.initialStock) || 0) + (Number(v.in) || 0) - (Number(v.out) || 0),
      used, diff:(Number(v.out) || 0) - used};
  }).filter(x => x.inQ || x.outQ || x.stock || x.used);
}
function usageUnitStats(agg){
  const byUnit = {};   // uid -> {docs:{}, mats:{}, qty}
  db.records.forEach(r => {
    if(r.transfer || r.type !== 'out') return;
    const uid = r.unitId || '';
    if(!byUnit[uid]) byUnit[uid] = {docs:{}, mats:{}, qty:0};
    byUnit[uid].docs[r.docNo] = 1;
    byUnit[uid].mats[r.materialId] = (byUnit[uid].mats[r.materialId] || 0) + (Number(r.qty) || 0);
    byUnit[uid].qty += Number(r.qty) || 0;
  });
  const uProj = {};    // uid -> [pid]
  db.projects.forEach(p => { if(p.unitId) (uProj[p.unitId] = uProj[p.unitId] || []).push(p.id); });
  const uHold = {};    // uid|mid -> qty
  Object.keys(uProj).forEach(uid => {
    uProj[uid].forEach(pid => {
      const pref = pid + '|';
      for(const k in agg.pm){
        if(k.indexOf(pref) !== 0) continue;
        const mid = k.slice(pref.length);
        const n = agg.pm[k].out - agg.pm[k].in;
        if(!n) continue;
        uHold[uid + '|' + mid] = (uHold[uid + '|' + mid] || 0) + n;
      }
    });
  });
  /* 已出库领用划拨：目标项目不属于该单位时，单独计入该单位的项目用量 */
  db.records.forEach(r => {
    if(!r.alloc || !r.unitId) return;
    const tp = db.projects.find(x => x.id === r.projectId);
    if(tp && tp.unitId === r.unitId) return;
    const key = r.unitId + '|' + r.materialId;
    uHold[key] = (uHold[key] || 0) + (r.type === 'out' ? 1 : -1) * (Number(r.qty) || 0);
  });
  const ids = [];
  Object.keys(byUnit).forEach(k => { if(ids.indexOf(k) < 0) ids.push(k); });
  Object.keys(uProj).forEach(k => { if(ids.indexOf(k) < 0) ids.push(k); });
  db.records.forEach(r => { if(r.alloc && r.unitId && ids.indexOf(r.unitId) < 0) ids.push(r.unitId); });
  const units = ids.map(uid => {
    const st = byUnit[uid] || {docs:{}, mats:{}, qty:0};
    const u = uid ? (unitObj(uid) || {id:uid, name:'（单位已删除）', contacts:[]})
                  : {id:'', name:'未指定施工单位', contacts:[]};
    const mids = [];
    Object.keys(st.mats).forEach(m => { if(mids.indexOf(m) < 0) mids.push(m); });
    Object.keys(uHold).forEach(k => {
      if(k.indexOf(uid + '|') !== 0) return;
      const m = k.slice((uid + '|').length);
      if(mids.indexOf(m) < 0) mids.push(m);
    });
    const rows = mids.map(mid => {
      const m = db.materials.find(x => x.id === mid) || {id:mid, name:'（物料已删除）', code:'', unit:''};
      const got = st.mats[mid] || 0;
      const used = uHold[uid + '|' + mid] || 0;
      return {m, got, used, rest: got - used};
    }).sort((a, b) => b.got - a.got || b.used - a.used);
    return {uid, u, docs:Object.keys(st.docs).length, qty:st.qty, rows,
      projCount:(uProj[uid] || []).length,
      holdSum:rows.reduce((n, r) => n + r.used, 0)};
  }).sort((a, b) => b.qty - a.qty || b.projCount - a.projCount || String(a.u.name).localeCompare(String(b.u.name)));
  return units;
}

function exportUsageBoard(){
  if(!can('usageBoard','export')){ toast('无导出权限', 'bad'); return; }
  const agg = loadAgg();
  const totals = usageTotals(agg);
  const units = usageUnitStats(agg);
  const lines = [];
  lines.push(['导出时间', nowTs()].map(csvCell).join(','));
  lines.push('');
  lines.push(['【设备使用总览】'].map(csvCell).join(','));
  lines.push(['物料编码','物料名称','单位','入库总数','出库总数','剩余总数','项目使用数量','出库与使用差异'].map(csvCell).join(','));
  totals.forEach(x => lines.push([x.m.code || '', x.m.name, x.m.unit || '', x.inQ, x.outQ, x.stock, x.used, x.diff].map(csvCell).join(',')));
  lines.push('');
  lines.push(['【施工单位领用明细】'].map(csvCell).join(','));
  lines.push(['施工单位','联系人','领用次数','负责项目数','物料编码','物料名称','单位','领用量','项目用量','剩余'].map(csvCell).join(','));
  units.forEach(u => {
    const brief = (u.u.contacts || []).map(c => (c.name || '') + (c.phone ? ' ' + c.phone : '')).filter(Boolean).join(' / ');
    if(!u.rows.length){
      lines.push([u.u.name, brief, u.docs, u.projCount, '', '', '', '', '', ''].map(csvCell).join(','));
      return;
    }
    u.rows.forEach(r => lines.push([u.u.name, brief, u.docs, u.projCount,
      r.m.code || '', r.m.name, r.m.unit || '', r.got, r.used, r.rest].map(csvCell).join(',')));
  });
  if(download('设备使用看板_' + today() + '.csv', lines.join('\n')))
    toast('已导出看板（' + units.length + ' 家单位 / ' + totals.length + ' 种物料）', 'ok');
}

/* ================= 显示与字体（v4.19） ================= */
const WIN_FONTS = ['微软雅黑','微软雅黑 Light','宋体','黑体','楷体','仿宋','等线','新宋体',
  '思源黑体','苹方','思源宋体','Segoe UI','Arial','Calibri','Consolas','Times New Roman','Tahoma','Verdana'];
function displayCfg(){
  const d = (db.settings && db.settings.display) || {};
  const sc = Number(d.scale);
  return {
    scale: isFinite(sc) ? Math.min(200, Math.max(50, Math.round(sc))) : 100,
    font: typeof d.font === 'string' ? d.font : ''
  };
}
function fontCandidates(sel){
  const set = new Set(WIN_FONTS);
  if(sel) set.add(sel);                 // 已选字体必须留在候选里，刷新后下拉才能回显
  (state.fonts || []).forEach(f => { if(f) set.add(f); });
  return Array.from(set).sort((a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN'));
}
function fontOptions(sel){
  return '<option value="">系统默认（跟随界面）</option>' +
    fontCandidates(sel).map(f => '<option value="' + esc(f) + '"' + (sel === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('');
}
function applyDisplay(){
  const d = displayCfg();
  const root = document.documentElement;
  if(d.scale === 100) root.style.zoom = '';
  else root.style.zoom = String(d.scale / 100);
  document.body.style.fontFamily = d.font ? ('"' + d.font + '", system-ui, -apple-system, "Microsoft YaHei", sans-serif') : '';
  const lab = document.getElementById('zoomLabel');
  if(lab) lab.textContent = d.scale + '%';
}
function setDisplay(patch, silent){
  /* 显示偏好不属于业务权限：只影响本机观感，任何人可调 */
  if(!db.settings.display) db.settings.display = {scale:100, font:''};
  Object.assign(db.settings.display, patch);
  saveDB();
  applyDisplay();
  if(!silent) toast('显示设置已保存', 'ok');
}

/* 项目排序：现有数量非空的排在前面，按数量倒序；数量相同按编号。
   筛选后依然走这里，所以每次筛选完顺序同样按持有量重排。 */
function sortProjectsByHold(agg, list){
  return list.slice().sort((a, b) => {
    const sa = projectTotal(agg, a.id), sb = projectTotal(agg, b.id);
    if((sa > 0) !== (sb > 0)) return sa > 0 ? -1 : 1;
    if(sb !== sa) return sb - sa;
    return String(a.code || '').localeCompare(String(b.code || ''));
  });
}

/* 汇总表只有在横向溢出时才冻结右侧列，避免表格没溢出时压住最后一列 */
/* ===== 表格列宽拖拽：表头右缘拖动，列宽存 localStorage，按 data-colkey 区分 ===== */
const COLW_KEY = 'wms_colw_v1';
let _colDrag = null;
function colWidthMap(){
  try{ return JSON.parse(localStorage.getItem(COLW_KEY) || '{}') || {}; }catch(e){ return {}; }
}
function colWidthsOf(key){
  const w = colWidthMap()[key];
  return Array.isArray(w) && w.length ? w : null;
}
function saveColWidthsOf(key, arr){
  const all = colWidthMap();
  all[key] = arr;
  try{ localStorage.setItem(COLW_KEY, JSON.stringify(all)); }catch(e){}
}
function resetColWidths(key){
  const all = colWidthMap();
  delete all[key];
  try{ localStorage.setItem(COLW_KEY, JSON.stringify(all)); }catch(e){}
}
/* 首次拖拽时把当前实际列宽固化成 colgroup，再切 fixed，保证视觉不跳 */
function lockTableCols(table, key){
  let cg = table.querySelector('colgroup');
  if(cg) return cg;
  const ths = Array.prototype.slice.call(table.querySelectorAll('thead tr:first-child th'));
  if(!ths.length) return null;
  const widths = ths.map(th => Math.round(th.getBoundingClientRect().width) || 0);
  cg = document.createElement('colgroup');
  cg.innerHTML = widths.map(w => '<col style="width:' + w + 'px">').join('');
  table.insertBefore(cg, table.firstChild);
  table.style.tableLayout = 'fixed';
  table.style.width = widths.reduce((a,b) => a + b, 0) + 'px';
  if(key) saveColWidthsOf(key, widths);
  return cg;
}
function applyColWidths(table, key){
  const w = colWidthsOf(key);
  if(!w) return;
  const ths = table.querySelectorAll('thead tr:first-child th');
  if(ths.length !== w.length) return;
  let cg = table.querySelector('colgroup');
  if(!cg){
    cg = document.createElement('colgroup');
    table.insertBefore(cg, table.firstChild);
  }
  cg.innerHTML = w.map(x => '<col style="width:' + x + 'px">').join('');
  table.style.tableLayout = 'fixed';
  table.style.width = w.reduce((a,b) => a + b, 0) + 'px';
}
/* 给所有带 data-colkey 的表格装上手柄（幂等，可反复调用） */
function initColResize(root){
  const scope = root || document;
  Array.prototype.forEach.call(scope.querySelectorAll('table[data-colkey]'), table => {
    const key = table.dataset.colkey;
    if(!key) return;
    applyColWidths(table, key);
    const ths = table.querySelectorAll('thead tr:first-child th');
    Array.prototype.forEach.call(ths, th => {
      if(th.querySelector('.col-grip')) return;
      th.classList.add('col-res');
      const g = document.createElement('span');
      g.className = 'col-grip';
      g.title = '拖动调整列宽，双击恢复';
      th.appendChild(g);
    });
  });
}
function colThFromGrip(grip){
  const th = grip.parentNode;
  const table = th.closest('table');
  if(!table || !table.dataset.colkey) return null;
  const ths = Array.prototype.slice.call(th.parentNode.children);
  const idx = ths.indexOf(th);
  const cg = lockTableCols(table, table.dataset.colkey);
  if(!cg) return null;
  return {table, key:table.dataset.colkey, idx, col:cg.children[idx], th};
}
document.addEventListener('mousedown', e => {
  const grip = e.target.closest ? e.target.closest('.col-grip') : null;
  if(!grip) return;
  e.preventDefault();
  e.stopPropagation();
  const ctx = colThFromGrip(grip);
  if(!ctx) return;
  _colDrag = {
    table: ctx.table, key: ctx.key, idx: ctx.idx, col: ctx.col,
    startX: e.clientX, startW: parseFloat(ctx.col.style.width) || ctx.th.offsetWidth
  };
  document.body.classList.add('col-resizing');
}, true);
document.addEventListener('mousemove', e => {
  if(!_colDrag) return;
  const w = Math.max(56, Math.round(_colDrag.startW + (e.clientX - _colDrag.startX)));
  _colDrag.col.style.width = w + 'px';
  const cols = Array.prototype.slice.call(_colDrag.table.querySelectorAll('colgroup col'));
  _colDrag.table.style.width = cols.reduce((s,c) => s + (parseFloat(c.style.width) || 0), 0) + 'px';
});
document.addEventListener('mouseup', () => {
  if(!_colDrag) return;
  const cols = Array.prototype.slice.call(_colDrag.table.querySelectorAll('colgroup col'));
  const widths = cols.map(c => Math.round(parseFloat(c.style.width) || 0));
  if(_colDrag.key) saveColWidthsOf(_colDrag.key, widths);
  _colDrag = null;
  document.body.classList.remove('col-resizing');
});
document.addEventListener('dblclick', e => {
  const grip = e.target.closest ? e.target.closest('.col-grip') : null;
  if(!grip) return;
  const table = grip.closest('table');
  if(!table || !table.dataset.colkey) return;
  resetColWidths(table.dataset.colkey);
  const cg = table.querySelector('colgroup');
  if(cg) cg.remove();
  table.style.tableLayout = '';
  table.style.width = '';
  toast('已恢复默认列宽', 'ok');
}, true);

function syncMatrixSticky(){
  const wrap = document.querySelector('.matrix-wrap');
  if(!wrap) return;
  wrap.classList.toggle('is-scroll', wrap.scrollWidth > wrap.clientWidth + 4);
}

/* 项目页主体：汇总表 or 左列表 + 右详情 */
/* ===== 已出库领用：从施工单位已领用额度划拨给项目（不动仓库库存） ===== */
function nextAllocNo(date){
  const p = 'LY-' + String(date).replace(/-/g, '');
  const used = new Set(db.records.filter(r => r.docNo && r.docNo.indexOf(p) === 0).map(r => r.docNo));
  let i = used.size + 1, no = p + '-' + String(i).padStart(3, '0');
  while(used.has(no)){ i++; no = p + '-' + String(i).padStart(3, '0'); }
  return no;
}
/* 单位口径：已领用（该单位非调拨出库）／已使用（负责项目持有 + 划拨给其它项目）／可领用 */
function unitQuota(uid){
  const agg = loadAgg();
  const got = {}, used = {};
  db.records.forEach(r => {
    if(r.transfer || r.type !== 'out' || r.unitId !== uid) return;
    got[r.materialId] = (got[r.materialId] || 0) + (Number(r.qty) || 0);
  });
  const myProjects = db.projects.filter(p => p.unitId === uid).map(p => p.id);
  myProjects.forEach(id => {
    const pref = id + '|';
    for(const k in agg.pm){
      if(k.indexOf(pref) !== 0) continue;
      const mid = k.slice(pref.length);
      used[mid] = (used[mid] || 0) + (agg.pm[k].out - agg.pm[k].in);
    }
  });
  db.records.forEach(r => {
    if(!r.alloc || r.unitId !== uid) return;
    const tp = db.projects.find(x => x.id === r.projectId);
    if(tp && tp.unitId === uid) return;         // 归属项目已体现在持有量里，避免重复
    used[r.materialId] = (used[r.materialId] || 0) + (r.type === 'out' ? 1 : -1) * (Number(r.qty) || 0);
  });
  const mids = Array.from(new Set(Object.keys(got).concat(Object.keys(used))));
  return mids.map(mid => {
    const m = db.materials.find(x => x.id === mid) || {id:mid, name:'（物料已删除）', code:'', unit:''};
    const g = got[mid] || 0, u = used[mid] || 0;
    return {m, got:g, used:u, rest:g - u};
  }).filter(x => x.got || x.used).sort((a, b) => b.rest - a.rest || b.got - a.got);
}

function saveAlloc(projectId){
  if(!can('outbound','create')){ toast('无出库登记权限', 'bad'); return; }
  const p = db.projects.find(x => x.id === projectId);
  if(!p) return;
  const allocUnitId = ($('#alloc-unit') || {}).value || '';
  if(!allocUnitId){ toast('请选择施工单位', 'bad'); return; }
  const date = ($('#alloc-date') || {}).value || today();
  const quota = {};
  unitQuota(allocUnitId).forEach(r => { quota[r.m.id] = r.rest; });
  const picked = [];
  $$('#allocBody .alloc-qty').forEach(inp => {
    const q = Math.max(0, Math.floor(Number(inp.value) || 0));
    if(!q) return;
    const mid = inp.dataset.mid;
    const rest = quota[mid] === undefined ? Infinity : quota[mid];
    if(q > rest){ inp.value = Math.max(0, rest); toast('「' + ((db.materials.find(m => m.id === mid) || {}).name || '') + '」超出可领用数量，已按上限调整', 'bad'); return; }
    picked.push({mid, q});
  });
  if(!picked.length){ toast('请填写本次领用数量', 'bad'); return; }
  const total = picked.reduce((n, x) => n + x.q, 0);
  askConfirm({title:'确认领用', heading:'从「' + (unitName(allocUnitId) || '该单位') + '」划拨给本项目？', okText:'确认领用',
    body:'项目 <b>' + esc(p.name) + '</b>，共 <b>' + picked.length + '</b> 种物料、数量合计 <b>' + fmt(total) + '</b>。<br>' +
      '本操作只调整项目持有量与单位结存，<b>不改变仓库库存</b>，也不会新增出入库台账。',
    onOk(){
      const docNo = nextAllocNo(date);
      const by = (typeof currentUser === 'function' && currentUser() ? (currentUser().name || currentUser().account) : '') || '';
      picked.forEach(x => {
        db.records.push({
          id: uid('r'), docNo, date, type: 'out', transfer: true, alloc: true,
          projectId: p.id, unitId: allocUnitId, warehouseId: '', materialId: x.mid, qty: x.q,
          operator: by, remark: '已出库领用划拨（来源单位：' + (unitName(allocUnitId) || '') + '）'
        });
      });
      saveDB();
      logAct('项目领用','新增','已出库领用划拨 ' + docNo + '，项目：' + p.name + '，单位：' + (unitName(allocUnitId) || '') + '，数量 ' + total);
      closeModal(); render();
      toast('已领用 ' + picked.length + ' 种物料，合计 ' + fmt(total), 'ok');
    }});
}

/* ===== 项目视图分栏宽度：拖拽右缘调整，存 localStorage ===== */
const PLW_KEY = 'wms_proj_split_w';
const PLW_MIN = 200, PLW_MAX = 520, PLW_DEF = 252;
function projSplitWidth(){
  let v = NaN;
  try{ v = Number(localStorage.getItem(PLW_KEY)); }catch(e){}
  if(!isFinite(v) || v < PLW_MIN || v > PLW_MAX) v = PLW_DEF;
  return Math.round(v);
}
function applyProjSplitWidth(w){
  const box = document.querySelector('.proj-split');
  if(!box) return;
  box.style.setProperty('--pl-w', w + 'px');
  const r = box.querySelector('.pl-resizer');
  if(r) r.style.left = (w - 5) + 'px';
}
function saveProjSplitWidth(w){
  try{ localStorage.setItem(PLW_KEY, String(Math.round(w))); }catch(e){}
}
function initProjSplit(){
  const box = document.querySelector('.proj-split');
  if(!box) return;
  applyProjSplitWidth(projSplitWidth());
  const r = box.querySelector('.pl-resizer');
  if(!r || r.dataset.bound) return;
  r.dataset.bound = '1';
  r.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX;
    const startW = projSplitWidth();
    let cur = startW;
    r.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const move = function(ev){
      cur = Math.min(PLW_MAX, Math.max(PLW_MIN, startW + (ev.clientX - startX)));
      applyProjSplitWidth(cur);
    };
    const up = function(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      r.classList.remove('dragging');
      saveProjSplitWidth(cur);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  r.addEventListener('dblclick', function(){
    applyProjSplitWidth(PLW_DEF);
    saveProjSplitWidth(PLW_DEF);
  });
}

function plFiltered(){
  const f = state.pl;
  const match = (val, sel) => sel === 'all' ? true
    : sel === '__none__' ? !String(val == null ? '' : val).trim()
    : String(val == null ? '' : val) === sel;
  return db.projects.filter(p => match(p.district, f.district) && match(p.owner, f.owner)
    && match(p.unitId, f.unit)
    && (f.status === 'all' || (p.status || '进行中') === f.status) && matchProject(p, f.kw));
}
function plValidateFilters(){
  const dF = projectFilterValues('district');
  const oF = projectFilterValues('owner');
  const ok = (v, F) => v === 'all' || (v === '__none__' ? F.blank : F.list.indexOf(v) >= 0);
  if(!ok(state.pl.district, dF)) state.pl.district = 'all';
  if(!ok(state.pl.owner, oF)) state.pl.owner = 'all';
  const u = state.pl.unit;
  if(u !== 'all' && u !== '__none__' && !ouList().some(x => x.id === u)) state.pl.unit = 'all';
}
function plFilterLabels(){
  const f = state.pl;
  return {
    d: f.district === 'all' ? '全部行政区' : (f.district === '__none__' ? '未分区' : f.district),
    o: f.owner === 'all' ? '全部负责人' : (f.owner === '__none__' ? '未指定负责人' : f.owner),
    u: f.unit === 'all' ? '全部施工单位' : (f.unit === '__none__' ? '未指定施工单位' : unitName(f.unit)),
    s: f.status === 'all' ? '全部状态' : f.status
  };
}

/* ================= 出库物资调拨 ================= */
function nextTransferNo(date){
  const p = 'DB-' + String(date).replace(/-/g,'');
  const used = new Set(db.records.filter(r => r.docNo && r.docNo.indexOf(p) === 0).map(r => r.docNo));
  let i = used.size + 1, no = p + '-' + String(i).padStart(3,'0');
  while(used.has(no)){ i++; no = p + '-' + String(i).padStart(3,'0'); }
  return no;
}
/* 某项目的领用单据：按单据号分组，日期倒序 */
function tfDocs(pid){
  const docs = {};
  db.records.forEach(r => {
    if(r.projectId !== pid || r.transfer || r.type !== 'out') return;
    if(!docs[r.docNo]) docs[r.docNo] = {docNo:r.docNo, date:r.date, operator:r.operator || '', remark:r.remark || '', items:{}};
    const it = docs[r.docNo].items[r.materialId] || (docs[r.docNo].items[r.materialId] = {mid:r.materialId, qty:0});
    it.qty += Number(r.qty) || 0;
  });
  const arr = Object.keys(docs).map(k => docs[k]);
  arr.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.docNo < b.docNo ? 1 : -1));
  return arr;
}
function tfCartOf(key){
  if(!state.tfCart[key] || !state.tfCart[key].length) state.tfCart[key] = [{to:'', qty:''}];
  return state.tfCart[key];
}

function tfDocPending(docNo){
  let n = 0;

  }
  return n;
}

/* 提交一张单据上的全部调拨明细 */
function submitTransfer(docNo){
  if(!canMod('projectTransfer','transfer')){ toast('无物资调拨权限', 'bad'); return; }
  const pid = state.tfProjectId;
  if(!pid){ toast('请先选择调出项目', 'bad'); return; }
  const agg = loadAgg();
  const from = db.projects.find(x => x.id === pid);
  const moves = [];       // {mid, to, qty}
  const perMat = {};      // mid -> 合计
  let bad = '';
  for(const key in state.tfCart){
    if(key.indexOf(docNo + '|') !== 0) continue;
    const mid = key.split('|')[1];
    (state.tfCart[key] || []).forEach(t => {
      const qty = Number(t.qty);
      if(!t.to || !(qty > 0)) return;
      if(t.to === pid){ bad = '接收项目不能与调出项目相同'; return; }
      if(!db.projects.some(x => x.id === t.to)){ bad = '接收项目不存在'; return; }
      moves.push({mid, to:t.to, qty});
      perMat[mid] = (perMat[mid] || 0) + qty;
    });
  }
  if(bad){ toast(bad, 'bad'); return; }
  if(!moves.length){ toast('请先为至少一项物资选择接收项目并填写数量', 'bad'); return; }
  for(const mid in perMat){
    const left = transferableQty(agg, pid, docNo, mid);
    if(perMat[mid] > left){
      const m = db.materials.find(x => x.id === mid);
      toast('「' + (m ? m.name : '') + '」本单最多可调拨 ' + fmt(left) + '，当前填写 ' + fmt(perMat[mid]), 'bad');
      return;
    }
  }
  const tno = nextTransferNo(today());
  const tid = uid('tf');
  const op = (currentUser() || {}).name || '未填写';
  const created = nowTs().slice(0,16);
  moves.forEach(mv => {
    const to = db.projects.find(x => x.id === mv.to) || {name:'', code:''};
    /* 调出方：type='in' 表示持有减少（仓库口径不计入） */
    db.records.push({
      id: uid('r'), docNo: tno, type: 'in', inType: 'transfer', isReturn: false,
      transfer: true, transferId: tid, srcDocNo: docNo,
      fromProjectId: pid, toProjectId: mv.to, projectId: pid, warehouseId: '',
      materialId: mv.mid, qty: mv.qty, date: today(), operator: op,
      remark: '调拨至 ' + (to.name || ''), createdAt: created
    });
    /* 接收方：type='out' 表示持有增加 */
    db.records.push({
      id: uid('r'), docNo: tno, type: 'out', inType: '', isReturn: false,
      transfer: true, transferId: tid, srcDocNo: docNo,
      fromProjectId: pid, toProjectId: mv.to, projectId: mv.to, warehouseId: '',
      materialId: mv.mid, qty: mv.qty, date: today(), operator: op,
      remark: '来自 ' + ((from && from.name) || '') + ' 调拨', createdAt: created
    });
  });
  saveDB();
  logAct('出库物资调拨', '新增', '调拨单 ' + tno + '：' + ((from && from.name) || '') +
    ' → ' + db.projects.filter(x => moves.some(m => m.to === x.id)).map(x => x.name).join('、') +
    '，共 ' + moves.length + ' 项，来源单据 ' + docNo);
  for(const key in state.tfCart) if(key.indexOf(docNo + '|') === 0) delete state.tfCart[key];
  render();
  toast('调拨单 ' + tno + ' 已提交，共 ' + moves.length + ' 项', 'ok');
}

/* ================= 入库 / 出库台账（按单据卡片） ================= */
function docLedgerType(){ return state.page === 'outboundLedger' ? 'out' : 'in'; }
function docLedgerFilter(type){
  const f = state.docLedger;
  const kw = String(f.kw || '').trim().toLowerCase();
  const MIDXM = MIDX(), PIDXM = PIDX(), WIDXM = WIDX();
  return db.records.filter(r => {
    if(r.type !== type) return false;
    if(r.transfer) return false;
    if(f.warehouseId !== 'all' && r.warehouseId !== f.warehouseId) return false;
    if(f.projectId !== 'all' && r.projectId !== f.projectId) return false;
    if(f.from && r.date < f.from) return false;
    if(f.to && r.date > f.to) return false;
    if(kw){
      const m = MIDXM[r.materialId], p = PIDXM[r.projectId], w = WIDXM[r.warehouseId];
      const hay = [r.docNo, r.operator, r.remark, r.date, m && m.code, m && m.name, m && m.spec, p && p.name, w && w.name]
        .join(' ').toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  }).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.docNo < b.docNo ? 1 : -1));
}
/* 按单据号分组：[{docNo, date, operator, warehouseId, projectId, inType, remark, items:[record]}] */
function groupDocs(list){
  const map = {}, out = [];
  list.forEach(r => {
    if(!map[r.docNo]){
      map[r.docNo] = {docNo:r.docNo, date:r.date, operator:r.operator, warehouseId:r.warehouseId,
        projectId:r.projectId, inType:r.inType, remark:r.remark, items:[]};
      out.push(map[r.docNo]);
    }
    map[r.docNo].items.push(r);
  });
  return out;
}

function modalDocEdit(docNo){
  const rows = db.records.filter(r => r.docNo === docNo);
  if(!rows.length){ toast('单据不存在', 'bad'); return; }
  if(rows.some(r => r.transfer)){ toast('调拨单请在「出库物资调拨」中查看', 'bad'); return; }
  const type = rows[0].type;
  const mod = type === 'in' ? 'inboundLedger' : 'outboundLedger';
  if(!canMod(mod,'edit')){ toast('无编辑该单据的权限', 'bad'); return; }
  const h0 = rows[0];
  docEdit = {
    docNo, type,
    head: {
      date: h0.date || today(),
      warehouseId: h0.warehouseId || (db.warehouses[0] || {}).id || '',
      projectId: h0.projectId || '',
      operator: h0.operator || '',
      unitId: type === 'out' ? (h0.unitId || '') : '',
      contactIdx: (() => {
        if(type !== 'out') return '';
        const list = unitContactsList(h0.unitId || '');
        const i = list.findIndex(c => c.name === (h0.contactName || '') && c.phone === (h0.contactPhone || ''));
        return i >= 0 ? String(i) : '';
      })(),
      inType: type === 'in' ? inTypeOf(h0) : '',
      remark: h0.remark || ''
    },
    rows: rows.map(r => ({materialId:r.materialId, qty:r.qty, remark:r.remark || ''}))
  };
  openModal('编辑' + (type === 'in' ? '入库' : '出库') + '单 ' + docNo, docEditBodyHtml(),
    '<button class="btn" data-act="closeModal">取消</button>' +
    '<button class="btn btn-primary" data-act="saveDocEdit">保存修改</button>', true);
}
function refreshDocEditBody(){
  const body = document.querySelector('#modalRoot .modal-body');
  if(body) body.innerHTML = docEditBodyHtml();
}
function saveDocEdit(){
  if(!docEdit) return;
  const mod = docEdit.type === 'in' ? 'inboundLedger' : 'outboundLedger';
  if(!canMod(mod,'edit')){ toast('无编辑该单据的权限', 'bad'); return; }
  const rows = docEdit.rows.filter(r => r.materialId && Number(r.qty) > 0);
  if(!rows.length){ toast('至少保留一行有效明细', 'bad'); return; }
  const bad = rows.find(r => !db.materials.some(m => m.id === r.materialId));
  if(bad){ toast('存在无效物料，请重新选择', 'bad'); return; }

  const h = docEdit.head || {};
  if(!h.date){ toast('请填写单据日期', 'bad'); return; }
  if(docEdit.type === 'in' && h.inType === 'return' && !h.projectId){
    toast('「项目返回入库」必须选择项目', 'bad'); return;
  }
  const oldRows = db.records.filter(r => r.docNo === docEdit.docNo);
  const base = oldRows[0];
  const rest = db.records.filter(r => r.docNo !== docEdit.docNo);
  const oldHeadRemark = base.remark || '';
  const newHeadRemark = h.remark || '';
  const newRows = rows.map(r => {
    /* 行备注若原本是从单头继承来的，单头改了要跟着改；用户单独填过的行备注保留 */
    let lineRemark = r.remark || '';
    if(!lineRemark || (oldHeadRemark && lineRemark === oldHeadRemark)) lineRemark = newHeadRemark;
    return {
      id: uid('r'), docNo: base.docNo, type: base.type,
      inType: docEdit.type === 'in' ? (h.inType || 'purchase') : base.inType,
      isReturn: docEdit.type === 'in' ? h.inType === 'return' : false,
      warehouseId: h.warehouseId || base.warehouseId,
      projectId: h.projectId || '',
      unitId: docEdit.type === 'out' ? (h.unitId || '') : (base.unitId || ''),
      contactName: docEdit.type === 'out' && unitContactAt(h.unitId, h.contactIdx) ? unitContactAt(h.unitId, h.contactIdx).name : '',
      contactPhone: docEdit.type === 'out' && unitContactAt(h.unitId, h.contactIdx) ? unitContactAt(h.unitId, h.contactIdx).phone : '',
      materialId: r.materialId, qty: Number(r.qty), date: h.date,
      operator: h.operator || '', remark: lineRemark,
      createdAt: base.createdAt || nowTs().slice(0,16)
    };
  });
  const tmp = rest.concat(newRows);

  /* 库存校验：改完后任何物料不得为负 */
  const mids = Array.from(new Set(newRows.map(r => r.materialId)));
  for(const mid of mids){
    const m = db.materials.find(x => x.id === mid);
    let s = Number(m.initialStock) || 0;
    tmp.forEach(r => { if(r.materialId === mid && !r.transfer) s += (r.type === 'in' ? 1 : -1) * Number(r.qty); });
    if(s < 0){ toast('「' + m.name + '」库存不足：改后为 ' + fmt(s) + '，请调小数量', 'bad'); return; }
  }
  /* 项目持有校验：本次单据涉及的项目，任一物料不得被扣成负数 */
  const affected = Array.from(new Set(newRows.map(r => r.projectId).filter(Boolean)));
  for(const pid of affected){
    for(const mid of mids){
      const m = db.materials.find(x => x.id === mid);
      let ps = 0;
      tmp.forEach(r => { if(r.projectId === pid && r.materialId === mid) ps += (r.type === 'out' ? 1 : -1) * Number(r.qty); });
      if(ps < 0){
        const pj = db.projects.find(x => x.id === pid);
        toast('项目「' + (pj ? pj.name : '') + '」持有不足：「' + m.name + '」改后为 ' + fmt(ps) + '，请调小数量或换项目', 'bad');
        return;
      }
    }
  }

  db.records = tmp;
  saveDB();
  logAct(base.type === 'in' ? '入库台账' : '出库台账', '编辑',
    '修改单据 ' + docEdit.docNo + '：' + oldRows.length + ' 行 → ' + newRows.length + ' 行' +
    '，日期 ' + h.date + (h.projectId ? '，项目 ' + ((db.projects.find(x => x.id === h.projectId) || {}).name || '') : ''));
  const dn = docEdit.docNo;
  docEdit = null;
  closeModal();
  render();
  toast('单据 ' + dn + ' 已更新，库存已重算', 'ok');
}
function deleteDoc(docNo){
  const rows = db.records.filter(r => r.docNo === docNo);
  if(!rows.length) return;
  if(rows.some(r => r.transfer)){ toast('调拨单不能在此删除', 'bad'); return; }
  const type = rows[0].type;
  const mod = type === 'in' ? 'inboundLedger' : 'outboundLedger';
  if(!canMod(mod,'delete')){ toast('无删除该单据的权限', 'bad'); return; }
  const qty = rows.reduce((s,r) => s + Number(r.qty), 0);
  /* 关联调拨：调拨流水的 docNo 是 DB-xxx，靠 srcDocNo 指向本源单据；
     源单被删后这些记录会成为孤儿（项目持有被永久占用），必须一起清理。 */
  const linked = db.records.filter(r => r.transfer && r.srcDocNo === docNo);
  const linkedTf = new Set(linked.map(r => r.transferId)).size;
  askConfirm({
    title: '删除单据', heading: '确认删除整张单据？', danger: true, okText: '删除整单',
    body: '单据 <b class="mono">' + esc(docNo) + '</b>，共 <b>' + rows.length + '</b> 行、数量合计 <b>' + fmt(qty) + '</b>。' +
      (linked.length ? '<br>该单已发起 <b>' + linkedTf + '</b> 张调拨（<b>' + linked.length + '</b> 条流水），删除时会<b>一并清除</b>，相关项目持有同步回滚。' : '') +
      '<br>删除后库存与项目持有量会同步回滚，且不可恢复。',
    onOk(){
      db.records = db.records.filter(r => r.docNo !== docNo && !(r.transfer && r.srcDocNo === docNo));
      saveDB();
      logAct(type === 'in' ? '入库台账' : '出库台账', '删除',
        '删除整单 ' + docNo + '，共 ' + rows.length + ' 行' + (linked.length ? '，连带清除 ' + linkedTf + ' 张调拨 / ' + linked.length + ' 条调拨流水' : ''));
      closeModal(); render();
      toast('单据 ' + docNo + ' 已删除' + (linked.length ? '，并清除 ' + linkedTf + ' 张关联调拨' : ''), 'ok');
    }
  });
}

/* ================= records ================= */
function filterRecords(){
  const f = state.recFilters;
  const kw = (f.kw || '').trim().toLowerCase();
  const MIDXM = MIDX(), PIDXM = PIDX(), WIDXM = WIDX();
  return db.records.filter(r => {
    if(f.type !== 'all' && r.type !== f.type) return false;
    if(f.projectId !== 'all' && r.projectId !== f.projectId) return false;
    if(f.materialId !== 'all' && r.materialId !== f.materialId) return false;
    if(f.warehouseId !== 'all' && r.warehouseId !== f.warehouseId) return false;
    if(f.from && r.date < f.from) return false;
    if(f.to && r.date > f.to) return false;
    if(kw){
      const m = MIDXM[r.materialId], p = PIDXM[r.projectId], w = WIDXM[r.warehouseId];
      const hay = [r.docNo, r.operator, r.remark, r.date, m && m.code, m && m.name, p && p.name, w && w.name].join(' ').toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  }).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.docNo < b.docNo ? 1 : -1));
}

  const f = state.recFilters;

      '<div class="field"><label>开始日期</label><input type="date" value="' + esc(f.from) + '" data-change="f" data-key="from"></div>' +

function recordTableHtml(){
  const list = filterRecords();
  const MIDXM = MIDX(), PIDXM = PIDX(), WIDXM = WIDX();
  const pages = Math.max(1, Math.ceil(list.length / REC_PER));
  if(state.recPage > pages) state.recPage = pages;
  const slice = list.slice((state.recPage - 1) * REC_PER, state.recPage * REC_PER);
  const sumIn = list.filter(r => r.type === 'in').reduce((s,r) => s + Number(r.qty), 0);
  const sumOut = list.filter(r => r.type === 'out').reduce((s,r) => s + Number(r.qty), 0);
  const docs = new Set(list.map(r => r.docNo)).size;

  const rows = slice.map(r => {
    const m = MIDXM[r.materialId], p = PIDXM[r.projectId], w = WIDXM[r.warehouseId];
    return '<tr><td class="mono"><a href="javascript:void(0)" data-act="viewDoc" data-doc="' + esc(r.docNo) + '" style="color:var(--primary);text-decoration:none">' + esc(r.docNo) + '</a></td>' +
      '<td>' + esc(r.date) + '</td>' +
      '<td>' + (r.transfer
        ? '<span class="badge badge-blue">调拨' + (r.type === 'in' ? '调出' : '调入') + '</span>'
        : (r.type === 'in' ? inBadge(r) : '<span class="badge badge-out">出库</span>')) + '</td>' +
      '<td>' + esc(w ? w.name : '-') + '</td>' +
      '<td>' + (p ? '<span class="dotc" style="background:' + pColor(p.id) + '"></span>' + esc(p.name) : '<span class="sub">—</span>') + '</td>' +
      '<td>' + (m ? esc(m.name) : '-') + ' <span class="sub">' + (m ? esc(m.spec) : '') + '</span></td>' +
      '<td class="num" style="' + ((r.transfer ? r.type === 'out' : r.type === 'in') ? 'color:var(--green)' : 'color:var(--red)') + ';font-weight:600">' +
        ((r.transfer ? r.type === 'out' : r.type === 'in') ? '+' : '-') + fmt(r.qty) + ' <span class="sub">' + (m ? esc(m.unit) : '') + '</span></td>' +
      '<td class="sub">' + esc(r.operator || '-') + '</td><td class="sub">' + esc(r.remark || '-') + '</td>' +
      '<td style="text-align:right">' +
        (can('records','delete')
          ? '<button class="btn btn-sm btn-ghost" style="color:var(--red)" data-act="delRecRow" data-id="' + r.id + '" title="删除这条流水">' + icon('trash') + '</button>'
          : '') +
      '</td></tr>';
  }).join('');

  const bar = '<div class="card-body" style="border-bottom:1px solid var(--border);display:flex;gap:22px;flex-wrap:wrap;padding:11px 16px">' +
    '<span class="sub">筛选结果 <b style="color:var(--text)">' + list.length + '</b> 行 / <b style="color:var(--text)">' + docs + '</b> 张单据</span>' +
    '<span class="sub">入库合计 <b style="color:var(--green)">+' + fmt(sumIn) + '</b></span>' +
    '<span class="sub">出库合计 <b style="color:var(--primary)">-' + fmt(sumOut) + '</b></span>' +
    '<span class="spacer"></span>' +
    (can('records','export') ? '<button class="btn btn-sm" data-act="exportRecords">' + icon('download') + '导出 CSV</button>' : '') + '</div>';

  if(!list.length) return bar + '<div class="empty">' + icon('search') + '<div>没有符合条件的记录</div></div>';
  return bar + '<div class="table-wrap"><table data-colkey="records" style="min-width:1060px"><thead><tr>' +
    '<th style="width:148px">单据号</th><th style="width:104px">日期</th><th style="width:92px">类型</th>' +
    '<th style="width:104px">仓库</th><th style="width:160px">项目</th><th>物料</th>' +
    '<th class="num" style="width:118px">数量</th><th style="width:88px">经办人</th><th style="width:150px">备注</th><th style="width:52px"></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function pagerHtml(){
  const list = filterRecords();
  const pages = Math.max(1, Math.ceil(list.length / REC_PER));
  return '<span>共 ' + list.length + ' 条 · 第 ' + state.recPage + ' / ' + pages + ' 页</span>' +
    '<button data-act="recPage" data-p="' + (state.recPage - 1) + '"' + (state.recPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
    '<button data-act="recPage" data-p="' + (state.recPage + 1) + '"' + (state.recPage >= pages ? ' disabled' : '') + '>下一页</button>';
}

  const acts = PERM_ACTS.filter(a => MODULES.some(m => m.acts.includes(a.id)));

  acts.forEach(a => { head += '<th>' + a.name + '</th>'; });

        const on = (perms[m.id] || []).includes(a.id);
        body += '<td><input type="checkbox" data-change="rolePerm" data-mod="' + m.id + '" data-p="' + a.id + '"' + (on ? ' checked' : '') + '></td>';
      }else{
        body += '<td><span style="color:#d0d5dd">—</span></td>';

}
function refreshPermMatrix(){
  const el = $('#permWrap');
  if(el){
    const acts = PERM_ACTS.filter(a => MODULES.some(m => m.acts.includes(a.id)));
    let head = '<tr><th>模块 / 功能</th>';
    acts.forEach(a => { head += '<th>' + a.name + '</th>'; });
    head += '</tr>';
    let body = '';
    MODULES.forEach(m => {
      body += '<tr><td><div>' + esc(modPermLabel(m)) + '</div><div class="mod-sub">' +
        '<a href="javascript:void(0)" style="color:var(--primary);text-decoration:none" data-act="permRow" data-mod="' + m.id + '">整行切换</a></div></td>';
      acts.forEach(a => {
        if(m.acts.includes(a.id)){
          const on = (permDraft[m.id] || []).includes(a.id);
          body += '<td><input type="checkbox" data-change="rolePerm" data-mod="' + m.id + '" data-p="' + a.id + '"' + (on ? ' checked' : '') + '></td>';
        }else body += '<td><span style="color:#d0d5dd">—</span></td>';
      });
      body += '</tr>';
    });
    el.innerHTML = '<table class="perm-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  }
  updatePermCount();
}
function updatePermCount(){
  const el = $('#permCount');
  if(el) el.textContent = '已选 ' + permCount(permDraft) + ' 项';
}

/* ================= 操作日志 ================= */
function filteredLogs(){
  const f = state.logFilters;
  const kw = (f.kw || '').trim().toLowerCase();
  return db.logs.filter(l => {
    if(f.userId !== 'all' && l.userId !== f.userId) return false;
    if(f.module !== 'all' && l.module !== f.module) return false;
    if(f.from && String(l.ts).slice(0,10) < f.from) return false;
    if(f.to && String(l.ts).slice(0,10) > f.to) return false;
    if(kw && !(l.detail + l.userName + l.account + l.module + l.action).toLowerCase().includes(kw)) return false;
    return true;
  });
}
function viewLogs(){
  if(!can('logs','view')) return roBanner('当前账号无权访问「' + modLabel('logs') + '」模块。');
  const f = state.logFilters;
  const userOpts = '<option value="all">全部账号</option>' + db.users.map(u =>
    '<option value="' + u.id + '"' + (f.userId === u.id ? ' selected' : '') + '>' + esc(u.name + '（' + u.account + '）') + '</option>').join('');
  const modNames = Array.from(new Set(db.logs.map(l => l.module).concat(['账号登录'])));
  const modOpts = '<option value="all">全部模块</option>' + modNames.map(m =>
    '<option value="' + esc(m) + '"' + (f.module === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
  const list = filteredLogs();
  const todayStr = today();
  const todayCnt = db.logs.filter(l => String(l.ts).slice(0,10) === todayStr).length;
  const ref = nowDate(); ref.setDate(ref.getDate() - 7);
  const refStr = new Date(ref.getTime() - ref.getTimezoneOffset() * 6e4).toISOString().slice(0,10);
  let activeSet = new Set(db.logs.filter(l => String(l.ts).slice(0,10) >= refStr).map(l => l.account));
  if(!activeSet.size) activeSet = new Set(db.logs.map(l => l.account));
  const activeUsers = activeSet.size;
  return '<div class="kpi-grid">' +
      '<div class="kpi"><div class="kpi-label">日志总量</div><div class="kpi-value">' + db.logs.length + '<small>条</small></div><div class="kpi-sub">最多保留最近 500 条</div></div>' +
      '<div class="kpi"><div class="kpi-label">今日操作</div><div class="kpi-value">' + todayCnt + '<small>条</small></div><div class="kpi-sub">' + todayStr + '</div></div>' +
      '<div class="kpi"><div class="kpi-label">近 7 日活跃账号</div><div class="kpi-value">' + activeUsers + '<small>个</small></div><div class="kpi-sub">含登录与业务操作</div></div>' +
      '<div class="kpi"><div class="kpi-label">当前筛选结果</div><div class="kpi-value">' + list.length + '<small>条</small></div><div class="kpi-sub">条件组合生效</div></div>' +
    '</div>' +
    '<div class="card mt16"><div class="card-head"><div class="card-title">' + icon('clock') + '操作日志 <span class="cnt" id="logCnt">' + list.length + ' 条</span></div>' +
      '<div class="row">' +
        (can('logs','export') ? '<button class="btn btn-sm" data-act="exportLogs">' + icon('download') + '导出</button>' : '') +
        (can('logs','delete') ? '<button class="btn btn-sm btn-danger" data-act="clearLogs">' + icon('trash') + '清空日志</button>' : '') +
      '</div></div>' +
      '<div class="card-body" style="border-bottom:1px solid var(--border)"><div class="log-filters">' +
        '<div class="field"><label>账号</label><select data-change="lf" data-key="userId">' + userOpts + '</select></div>' +
        '<div class="field"><label>模块</label><select data-change="lf" data-key="module">' + modOpts + '</select></div>' +
        '<div class="field"><label>开始日期</label><input type="date" value="' + esc(f.from) + '" data-change="lf" data-key="from"></div>' +
        '<div class="field"><label>结束日期</label><input type="date" value="' + esc(f.to) + '" data-change="lf" data-key="to"></div>' +
        '<div class="field"><label>关键字</label><input id="logKw" value="' + esc(f.kw) + '" placeholder="模块 / 操作 / 详情 / 姓名"></div>' +
      '</div><div class="row mt12"><button class="btn btn-sm" data-act="clearLogFilters">重置筛选</button>' +
        '<span class="sub">日志按时间倒序排列，记录登录与所有数据变更操作</span></div></div>' +
      '<div class="card-body tight" id="logTable">' + logTableHtml() + '</div>' +
      '<div class="pager" id="logPager">' + logPagerHtml() + '</div>' +
    '</div>';
}
function logTableHtml(){
  const list = filteredLogs();
  const pages = Math.max(1, Math.ceil(list.length / LOG_PER));
  if(state.logPage > pages) state.logPage = pages;
  const rows = list.slice((state.logPage - 1) * LOG_PER, state.logPage * LOG_PER).map(l => {
    const actCls = l.action === '删除' ? 'badge-danger' : (l.action === '新增' ? 'badge-in' : (l.action === '登录' ? 'badge-blue' : 'badge-muted'));
    return '<tr><td class="sub" style="white-space:nowrap">' + esc(l.ts) + '</td>' +
      '<td><div style="font-weight:500">' + esc(l.userName) + '</div><div class="sub mono">' + esc(l.account) + '</div></td>' +
      '<td>' + esc(l.module) + '</td>' +
      '<td><span class="badge ' + actCls + '">' + esc(l.action) + '</span></td>' +
      '<td class="sub">' + esc(l.detail || '-') + '</td>' +
      '<td class="sub mono">' + esc(l.ip || '-') + '</td></tr>';
  }).join('') || '<tr><td colspan="6"><div class="empty">没有符合条件的日志</div></td></tr>';
  return '<div class="table-wrap"><table><thead><tr><th>时间</th><th>账号</th><th>模块</th><th>操作</th><th>详情</th><th>IP</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
function logPagerHtml(){
  const list = filteredLogs();
  const pages = Math.max(1, Math.ceil(list.length / LOG_PER));
  return '<span>共 ' + list.length + ' 条 · 第 ' + state.logPage + ' / ' + pages + ' 页</span>' +
    '<button data-act="logPage" data-p="' + (state.logPage - 1) + '"' + (state.logPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
    '<button data-act="logPage" data-p="' + (state.logPage + 1) + '"' + (state.logPage >= pages ? ' disabled' : '') + '>下一页</button>';
}
function refreshLogs(){
  const t = $('#logTable'); if(t) t.innerHTML = logTableHtml();
  const p = $('#logPager'); if(p) p.innerHTML = logPagerHtml();
  const c = $('#logCnt'); if(c) c.textContent = filteredLogs().length + ' 条';
}

/* 图片压缩：按最大宽度等比缩放并转 JPEG，降低 localStorage 占用 */
function compressImage(file, maxW, quality){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try{
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h) throw new Error('图片尺寸无效');
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        if(!ctx) throw new Error('当前浏览器不支持图片压缩');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      }catch(err){ URL.revokeObjectURL(url); rej(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('图片无法解析')); };
    img.src = url;
  });
}

function loginError(msg){
  const el = $('#lg-error');
  if(el){ el.textContent = msg; el.style.display = 'block'; }

function doLogin(){
  const acc = ($('#lg-account') || {}).value ? $('#lg-account').value.trim() : '';
  const pwd = ($('#lg-pwd') || {}).value || '';
  if(!acc){ loginError('请输入登录账号'); return; }
  if(!pwd){ loginError('请输入登录密码'); return; }
  const u = db.users.find(x => x.account.toLowerCase() === acc.toLowerCase());
  if(!u){ loginError('账号不存在，请检查后重试'); return; }
  if(u.status !== '启用'){ loginError('该账号已停用，请联系管理员'); return; }
  if(u.pwd !== hashPw(pwd)){ loginError('密码错误，请重新输入'); return; }
  session = {userId:u.id, guest:false};
  saveSession();
  u.lastLogin = nowTs();
  saveDB();
  logAct('账号登录', '登录', '账号密码登录成功');
  $('#loginRoot').innerHTML = '';
  // 当前页有权限就留在原页，否则跳到该账号第一个可访问页面
  if(!pageCan(state.page, 'view')){
    state.page = DATA_MODULES.concat(['accounts','logs','backups','settings']).find(k => can(k,'view')) || 'dashboard';
  }
  render();
  toast('欢迎回来，' + u.name, 'ok');
}

function openCtxMenu(x, y, pageId){

  ctxPage = pageId;
  const canEdit = can('settings', 'edit');
  el.innerHTML = '<div class="ctx-head">' + esc(modLabel(pageId)) + '</div>' +

      : '<button disabled>' + icon('shield') + '无重命名权限</button>');

  el.style.left = '0px'; el.style.top = '0px';
  const w = el.offsetWidth, h = el.offsetHeight;

function saveModuleName(){
  if(!can('settings', 'edit')){ toast('当前账号无设置修改权限', 'bad'); return; }
  const id = _renameId, el = $('#rn-name');
  if(!id || !el || !PAGES[id]) return;
  const v = String(el.value || '').trim();
  const def = PAGES[id].t;
  if(!v){ toast('模块名称不能为空', 'bad'); return; }
  if(v.length > 12){ toast('模块名称最多 12 个字符', 'bad'); return; }
  if(v === modLabel(id)){ closeModal(); return; }
  if(MODULES.some(m => m.id !== id && (modLabel(m.id) === v || m.name === v))){ toast('已存在同名模块，请换一个名称', 'bad'); return; }
  if(!db.settings.moduleNames) db.settings.moduleNames = {};
  if(v === def) delete db.settings.moduleNames[id];
  else db.settings.moduleNames[id] = v;
  saveDB();
  logAct('工作台设置', '编辑', '将模块「' + def + '」重命名为「' + v + '」');
  closeModal(); render();
  toast('模块名称已更新为「' + v + '」', 'ok');
}
function resetModuleName(pageId){
  if(!can('settings', 'edit')){ toast('当前账号无设置修改权限', 'bad'); return; }
  const id = pageId || _renameId;
  if(!id || !PAGES[id]) return;
  if(!isRenamed(id)){ toast('该模块已是默认名称', 'bad'); closeModal(); return; }

  delete db.settings.moduleNames[id];

  logAct('工作台设置', '编辑', '将模块「' + old + '」恢复为默认名称「' + def + '」');
  closeModal(); closeCtxMenu(); render();
  toast('已恢复默认名称「' + def + '」', 'ok');
}

}

/* ================= xlsx / csv import ================= */
function colIndex(letters){
  let n = 0;
  for(const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
async function inflateRaw(data){
  if(typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持解析 xlsx，请另存为 CSV 后导入');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([data]).stream().pipeThrough(ds);
  const ab = await new Response(stream).arrayBuffer();
  return new Uint8Array(ab);
}
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  const lower = Math.max(0, u8.length - 66000);
  for(let i = u8.length - 22; i >= lower; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('不是有效的 xlsx 文件');
  const count = dv.getUint16(eocd + 10, true);
  const cdOff = dv.getUint32(eocd + 16, true);
  const out = {};
  let p = cdOff;
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true);
    const elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.slice(p + 46, p + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    const data = u8.slice(start, start + csize);
    if(method === 0) out[name] = data;
    else if(method === 8) out[name] = await inflateRaw(data);
    p += 46 + nlen + elen + clen;
  }
  return out;
}
async function parseXLSX(buf){
  const zip = await unzip(buf);
  const dec = new TextDecoder('utf-8');
  const sheetPath = Object.keys(zip).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!sheetPath) throw new Error('未找到工作表');
  const shared = [];
  if(zip['xl/sharedStrings.xml']){
    const doc = new DOMParser().parseFromString(dec.decode(zip['xl/sharedStrings.xml']), 'application/xml');
    Array.from(doc.getElementsByTagName('si')).forEach(si => {
      shared.push(Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
    });
  }
  const doc = new DOMParser().parseFromString(dec.decode(zip[sheetPath]), 'application/xml');
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach(rowEl => {
    const arr = [];
    Array.from(rowEl.getElementsByTagName('c')).forEach(c => {
      const ref = c.getAttribute('r') || '';
      const idx = colIndex(ref.replace(/\d+/g, ''));
      const t = c.getAttribute('t');
      let val = '';
      if(t === 'inlineStr'){
        val = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join('');
      }else{
        const v = c.getElementsByTagName('v')[0];
        val = v ? v.textContent : '';
        if(t === 's') val = shared[Number(val)] || '';
      }
      if(idx >= 0) arr[idx] = val;
    });
    rows.push(arr.map(v => v == null ? '' : String(v)));
  });
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
function parseCSV(text){
  text = text.replace(/^\ufeff/, '');
  const rows = [];
  let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }else{
      if(c === '"') q = true;
      else if(c === ','){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c !== '\r') cell += c;
    }
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
async function readTextAuto(file){
  const buf = await file.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if(txt.indexOf('\ufffd') >= 0){
    try{ txt = new TextDecoder('gbk').decode(buf); }catch(e){}
  }
  return txt;
}
function normDate(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return '';
  if(/^\d+(\.\d+)?$/.test(s)){
    const n = Number(s);
    if(n > 20000 && n < 80000){
      const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
      return d.toISOString().slice(0,10);
    }
  }
  const m = s.match(/^(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);
  if(m) return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
  return s;
}

function download(filename, text){
  try{
    const isJson = /\.json$/i.test(String(filename));
    // CSV 需要 BOM 让 Excel 正确识别 UTF-8；JSON 不能带 BOM，否则 JSON.parse 失败
    const body = isJson ? String(text) : '\ufeff' + text;
    const blob = new Blob([body], {type: (isJson ? 'application/json' : 'text/csv') + ';charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return true;
  }catch(e){ toast('当前环境不支持直接下载', 'bad'); return false; }
}

function exportProjectCSV(id){

  const agg = loadAgg();
  const lines = [];
  lines.push(['项目编号', p.code].map(csvCell).join(','));
